<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="manifest" href="../../site.webmanifest">
<meta name="theme-color" content="#f0f0f0">
<meta property="og:site_name" content="도구모음">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dgmoum.com/assets/og-image.png">
<meta property="og:title" content="퇴직증명서 양식 만들기 · 도구모음">
<meta property="og:description" content="퇴직(퇴사)증명서를 칸만 채워 PDF로 저장하세요. 근무 기간·부서·직위, 회사 직인. 무료, 가입 없음.">
<title>퇴직증명서 양식 만들기 · 도구모음</title>
<meta name="description" content="퇴직(퇴사)증명서를 칸만 채워 PDF로 저장하세요. 근무 기간·부서·직위, 회사 직인. 무료, 가입 없음.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style> body { --cat: var(--form); } </style>
<link rel="stylesheet" href="/transition.css"><link rel="stylesheet" href="/command.css"><link rel="stylesheet" href="/studio.css">
<link rel="icon" type="image/png" href="/assets/dg-logo.png"><link rel="apple-touch-icon" href="/assets/dg-logo.png">
</head>
<body data-tool="form-retire">
<header id="hdr"></header>

<main class="wrap">
  <div class="tool-head">
    <span class="tool-tag" data-icon="form-retire"></span>
    <div>
      <h1>퇴직증명서 만들기</h1>
      <p>회사가 퇴사한 사람에게 근무 기간과 퇴직 사실을 확인해 주는 문서예요.</p>
    </div>
  </div>

  <div class="fwrap">
    <section class="panel feditor"><div class="panel-body" id="editor"></div></section>
    <section class="fpreview">
      <div class="ftool">
        <button class="btn btn-primary" id="print">PDF로 저장 · 인쇄</button>
        <span class="hint">인쇄 창에서 대상을 <b>PDF로 저장</b>으로 고르세요. 머리글·바닥글은 끄는 게 깔끔해요.</span>
      </div>
      <div class="fstage" id="stage"><div class="fscale" id="scale"><div class="sheet" id="sheet"></div></div></div>
      <div class="fnotes">
      <p>회사가 발급하는 문서예요. 공식 서식은 아니라서, 제출처가 정한 양식이 있으면 그걸 쓰세요.</p>
      <p>실업급여 신청에 필요한 이직확인서는 회사가 고용센터(고용24)에 따로 내야 해요.</p>
      </div>
    </section>
  </div>
  <div class="ad-slot" id="ad-main"></div>
  <a class="fjump btn btn-primary" href="#stage">미리보기 · 인쇄 ↓</a>
</main>

<footer id="foot"></footer>

<script src="../../assets/common.js"></script>
<script src="../../assets/i18n.js"></script>
<script src="../../assets/shell.js" data-root="../../"></script>
<script src="../../assets/forms.js"></script>
<script>
(() => {

  TF.make({
    fileName: v => ["퇴직증명서", v.name, v.biz_name].filter(Boolean).join("_"),
    fields: [
      { sec: "퇴직자" },
      { k: "name", label: "이름", ph: "이름을 입력하세요", half: true },
      { k: "birth", label: "생년월일", type: "date", half: true },
      { k: "addr", label: "주소 (선택)", ph: "주소를 입력하세요" },
      { sec: "근무 내용" },
      { k: "dept", label: "마지막 부서", ph: "부서를 입력하세요", half: true },
      { k: "pos", label: "마지막 직위", ph: "직위를 입력하세요", half: true },
      { k: "join", label: "입사일", type: "date", half: true },
      { k: "leave", label: "퇴직일", type: "date", half: true },
      { k: "work", label: "담당 업무 (선택)", ph: "담당 업무를 입력하세요" },
      { k: "reason", label: "퇴직 사유", type: "select", opts: [["", "표시 안 함"], ["개인 사정", "개인 사정"], ["계약 기간 만료", "계약 기간 만료"], ["정년 퇴직", "정년 퇴직"], ["회사 사정", "회사 사정"]], half: true, help: "사유는 본인이 원할 때만 넣으세요." },
      { k: "purpose", label: "용도 · 제출처", ph: "예: 실업급여 신청용", half: true },
      { k: "no", label: "발급 번호 (선택)", ph: "예: 2026-021" },
      { sec: "회사 (발급하는 곳)" },
      { k: "biz_name", label: "회사명", ph: "회사명을 입력하세요", half: true, mem: "biz" },
      { k: "biz_ceo", label: "대표자", ph: "이름을 입력하세요", half: true, mem: "biz" },
      { k: "biz_no", label: "사업자등록번호", ph: "000-00-00000", half: true, mem: "biz" },
      { k: "biz_tel", label: "전화", ph: "전화번호를 입력하세요", half: true, mem: "biz" },
      { k: "biz_addr", label: "주소", ph: "주소를 입력하세요", mem: "biz" },
      { k: "date", label: "발급일", type: "date", def: "today" },
      { stamp: "biz_stamp" }
    ],
    stamps: [{ k: "biz_stamp", label: "회사 직인", mem: "biz", kind: "stamp" }],
    render(v, H) {
      return `${H.has("no") ? `<p class="d-small d-muted" style="margin:0 0 4mm">제 ${H.t("no")} 호</p>` : ""}
        <h1 class="d-title" style="margin-bottom:10mm">퇴직증명서</h1>
        <p class="d-sec">인적 사항</p>
        <table class="d-tbl d-kv"><tr><th>성명</th><td>${H.t("name")}</td><th>생년월일</th><td>${H.kdate(v.birth)}</td></tr>
          <tr><th>주소</th><td colspan="3">${H.t("addr")}</td></tr></table>
        <p class="d-sec">근무 사항</p>
        <table class="d-tbl d-kv"><tr><th>회사명</th><td colspan="3">${H.t("biz_name")}</td></tr>
          <tr><th>부서</th><td>${H.t("dept")}</td><th>직위</th><td>${H.t("pos")}</td></tr>
          <tr><th>근무 기간</th><td colspan="3">${H.date("join")} ~ ${H.date("leave")}</td></tr>
          ${H.has("work") ? `<tr><th>담당 업무</th><td colspan="3">${H.t("work")}</td></tr>` : ""}
          ${v.reason ? `<tr><th>퇴직 사유</th><td colspan="3">${H.t("reason")}</td></tr>` : ""}
          <tr><th>용도</th><td colspan="3">${H.t("purpose")}</td></tr></table>
        <p class="d-center d-big" style="margin:16mm 0 4mm;letter-spacing:.06em">위 사람은 당사에서 위와 같이 근무하고 퇴직하였음을 증명합니다.</p>
        <div class="d-sign" style="justify-items:center"><p class="date">${H.date("date")}</p></div>
        <table class="d-tbl d-kv" style="width:120mm;margin:6mm auto 0">
          <tr><th>회사명</th><td>${H.t("biz_name")}</td></tr>
          <tr><th>사업자번호</th><td class="d-mono">${H.t("biz_no")}</td></tr>
          <tr><th>주소</th><td>${H.t("biz_addr")}</td></tr>
          <tr><th>전화</th><td>${H.t("biz_tel")}</td></tr>
          <tr><th>대표자</th><td><span class="d-namecell"><span>${H.t("biz_ceo")}</span>${H.stamp("biz_stamp", "(직인)")}</span></td></tr>
        </table>`;
    }
  });
})();
</script>
<script src="/vendor/gsap.min.js"></script><script src="/vendor/lucide.min.js"></script><script src="/vendor/fuse.min.js"></script><script src="/common-ui.js"></script><script src="/studio.js"></script>
</body>
</html>
