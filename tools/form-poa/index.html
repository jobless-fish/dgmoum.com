<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>위임장 양식 만들기 · 뚝딱툴</title>
<meta name="description" content="위임장을 칸만 채워 PDF로 저장하세요. 위임인·수임인, 위임 사항, 서명 넣기. 무료, 가입 없음.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/forms.css">
<style> body { --cat: var(--form); } </style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="../../"><span class="brand-mark">뚝딱툴</span></a>
    <nav class="crumb"><span>/</span><strong>위임장 만들기</strong></nav>
    <span class="spacer"></span>
    <span class="privacy-pill">업로드 없음</span>
  </div>
</header>

<main class="wrap">
  <div class="tool-head">
    <span class="tool-tag" data-icon="form-poa"></span>
    <div>
      <h1>위임장 만들기</h1>
      <p>서류 발급이나 신청을 다른 사람에게 맡길 때 쓰는 위임장이에요.</p>
    </div>
  </div>

  <div class="fwrap">
    <section class="panel feditor"><div class="panel-body" id="editor"></div></section>
    <section class="fpreview">
      <div class="ftool">
        <button class="btn btn-primary" id="print">PDF로 저장 · 인쇄</button>
        <span class="hint">인쇄 창에서 대상을 <b>PDF로 저장</b>으로 고르세요. 머리글·바닥글은 끄는 게 깔끔해요.</span>
      </div>
      <div class="fstage" id="stage"><div class="fscale" id="scale"><div class="sheet" id="sheet"></div></div></div>
      <div class="fnotes">
      <p><b>기관마다 정해진 위임장이 있을 수 있어요.</b> 관공서·은행은 자체 양식이나 인감증명서, 신분증 사본을 따로 요구하기도 하니 미리 확인하세요.</p>
      </div>
    </section>
  </div>
  <div class="ad-slot" id="ad-main"></div>
  <a class="fjump btn btn-primary" href="#stage">미리보기 · 인쇄 ↓</a>
</main>

<footer class="foot"><div class="wrap"><span>적은 내용은 이 브라우저 안에서만 쓰여요.</span><a href="../../">다른 도구 보기</a></div></footer>

<script src="../../assets/common.js"></script>
<script src="../../assets/forms.js"></script>
<script>
(() => {

  TF.make({
    fileName: v => ["위임장", v.me_name].filter(Boolean).join("_"),
    fields: [
      { sec: "위임하는 사람 (본인)" },
      { k: "me_name", label: "이름", ph: "이름을 입력하세요", half: true, mem: "me" },
      { k: "me_birth", label: "생년월일", type: "date", half: true, mem: "me" },
      { k: "me_tel", label: "연락처", ph: "전화번호를 입력하세요", half: true, mem: "me" },
      { k: "me_addr", label: "주소", ph: "주소를 입력하세요", mem: "me" },
      { sec: "위임받는 사람 (대리인)" },
      { k: "ag_name", label: "이름", ph: "이름을 입력하세요", half: true },
      { k: "ag_birth", label: "생년월일", type: "date", half: true },
      { k: "ag_tel", label: "연락처", ph: "전화번호를 입력하세요", half: true },
      { k: "ag_rel", label: "본인과의 관계", ph: "예: 배우자, 직원", half: true },
      { k: "ag_addr", label: "주소", ph: "주소를 입력하세요" },
      { sec: "위임 내용" },
      { k: "to", label: "제출처", ph: "예: OO구청 민원과", half: true },
      { k: "purpose", label: "용도", ph: "예: 서류 발급", half: true },
      { k: "what", label: "위임 사항", type: "textarea", ph: "대신 처리할 일을 구체적으로 입력하세요" },
      { sec: "확인" },
      { k: "date", label: "작성일", type: "date", def: "today" },
      { stamp: "me_sign" }
    ],
    stamps: [{ k: "me_sign", label: "서명 · 도장", mem: "me", kind: "sign" }],
    render(v, H) {
      const who = (p, label, rel) => `<table class="d-tbl d-kv"><colgroup><col style="width:7mm"><col style="width:20mm"><col><col style="width:20mm"><col></colgroup>
        <tr><th class="vlabel" rowspan="${rel ? 4 : 3}">${label}</th><th>성명</th><td>${H.t(p + "_name")}</td><th>생년월일</th><td>${H.kdate(v[p + "_birth"])}</td></tr>
        <tr><th>주소</th><td colspan="3">${H.t(p + "_addr")}</td></tr>
        <tr><th>연락처</th><td colspan="3">${H.t(p + "_tel")}</td></tr>
        ${rel ? `<tr><th>관계</th><td colspan="3">${H.t(p + "_rel")}</td></tr>` : ""}</table>`;
      return `<h1 class="d-title" style="margin-bottom:10mm">위임장</h1>
        ${who("me", "위임인", false)}${who("ag", "수임인", true)}
        <table class="d-tbl d-kv"><tr><th>제출처</th><td>${H.t("to")}</td><th>용도</th><td>${H.t("purpose")}</td></tr></table>
        <p class="d-box-label" style="margin-top:4mm">위임 사항</p><div class="d-box" style="min-height:52mm">${H.nl("what")}</div>
        <p class="d-p d-big" style="margin:10mm 0;line-height:2">본인은 위 수임인에게 위 사항에 관한 권한을 위임합니다.</p>
        <div class="d-sign">
          <p class="date">${H.date("date")}</p>
          <p class="who">위임인 <span class="fill" style="min-width:30mm">${H.t("me_name") || "&nbsp;"}</span> ${H.stamp("me_sign", "(서명 또는 인)")}</p>
        </div>
        ${H.has("to") ? `<p class="d-to">${H.t("to")} 귀중</p>` : ""}`;
    }
  });
})();
</script>
</body>
</html>
