<script>
(() => {

  const $ = s => document.querySelector(s);
  const say = TT.sayTo($("#status"));
  const val = n => document.querySelector(`input[name=${n}]:checked`).value;

  // ── 필터: CSS filter와 같은 계산을 픽셀에 직접 해요 (사파리에서도 똑같이 나오게)
  const FILTERS = [
    ["원본", [], 0],
    ["뽀샤시", [["sepia", .08], ["contrast", .84], ["brightness", 1.35]], .5],
    ["더 뽀샤시", [["sepia", .1], ["saturate", .9], ["contrast", .78], ["brightness", 1.6]], .7],
    ["하얀 피부", [["saturate", .85], ["contrast", .74], ["brightness", 1.85]], .6],
    ["분홍 셀카", [["hue", -18], ["saturate", 1.15], ["contrast", .86], ["brightness", 1.4]], .5],
    ["추억 세피아", [["sepia", .4], ["contrast", .9], ["brightness", 1.25]], .4],
    ["누런 사진", [["sepia", .65], ["hue", -8], ["contrast", .84], ["brightness", 1.45]], .5],
    ["초록 웹캠", [["sepia", .1], ["hue", 32], ["saturate", .55], ["contrast", .82], ["brightness", 1.55]], .7],
    ["진초록 웹캠", [["sepia", .12], ["hue", 52], ["saturate", .75], ["contrast", .8], ["brightness", 1.5]], .9],
    ["푸른 밤", [["sepia", .2], ["hue", 165], ["saturate", .7], ["contrast", .9], ["brightness", 1.15]], .5],
    ["흑백", [["gray", 1], ["contrast", .9], ["brightness", 1.3]], .4],
    ["하얀 흑백", [["gray", 1], ["contrast", .84], ["brightness", 1.8]], .5],
  ];
  function matrix(k, a) {
    if (k === "sepia") { const b = 1 - a; return [.393 + .607 * b, .769 - .769 * b, .189 - .189 * b, .349 - .349 * b, .686 + .314 * b, .168 - .168 * b, .272 - .272 * b, .534 - .534 * b, .131 + .869 * b]; }
    if (k === "gray") { const b = 1 - a; return [.2126 + .7874 * b, .7152 - .7152 * b, .0722 - .0722 * b, .2126 - .2126 * b, .7152 + .2848 * b, .0722 - .0722 * b, .2126 - .2126 * b, .7152 - .7152 * b, .0722 + .9278 * b]; }
    if (k === "saturate") return [.213 + .787 * a, .715 - .715 * a, .072 - .072 * a, .213 - .213 * a, .715 + .285 * a, .072 - .072 * a, .213 - .213 * a, .715 - .715 * a, .072 + .928 * a];
    if (k === "hue") { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
      return [.213 + c * .787 - s * .213, .715 - c * .715 - s * .715, .072 - c * .072 + s * .928,
              .213 - c * .213 + s * .143, .715 + c * .285 + s * .140, .072 - c * .072 - s * .283,
              .213 - c * .213 - s * .787, .715 - c * .715 + s * .715, .072 + c * .928 + s * .072]; }
    return null;
  }
  function applyOps(img, ops) {
    if (!ops.length) return;
    const steps = ops.map(([k, a]) => ({ k, a, m: matrix(k, a) }));
    const d = img.data, cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      for (const s of steps) {
        if (s.m) { const m = s.m; const R = m[0] * r + m[1] * g + m[2] * b, G = m[3] * r + m[4] * g + m[5] * b, B = m[6] * r + m[7] * g + m[8] * b; r = cl(R); g = cl(G); b = cl(B); }
        else if (s.k === "contrast") { r = cl((r - .5) * s.a + .5); g = cl((g - .5) * s.a + .5); b = cl((b - .5) * s.a + .5); }
        else if (s.k === "brightness") { r = cl(r * s.a); g = cl(g * s.a); b = cl(b * s.a); }
      }
      d[i] = r * 255; d[i + 1] = g * 255; d[i + 2] = b * 255;
    }
  }
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  // 필터 한 번 입힌 그림 (soft: 살짝 작게 그렸다 키워서 웹캠처럼 흐릿하게)
  function filtered(w, h, f) {
    const c = mk(w, h), x = c.getContext("2d", { willReadFrequently: true });
    if (f[2]) {
      const s = 1 / (1 + f[2] * .55), t = mk(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)));
      t.getContext("2d").drawImage(src, 0, 0, t.width, t.height);
      x.imageSmoothingQuality = "high"; x.drawImage(t, 0, 0, w, h);
    } else x.drawImage(src, 0, 0, w, h);
    if (f[1].length) { const id = x.getImageData(0, 0, w, h); applyOps(id, f[1]); x.putImageData(id, 0, 0); }
    return c;
  }

  // ── 싸이체
  // 싸이체 변환기 (도구모음 자체 제작) — 브라우저와 node 양쪽에서 쓰려고 함수 하나로 묶음
  function makeCy() {

      "제": ["ㅈㅔ", "スㅔ"], "께": ["ㄲㅔ"], "게": ["ㄱㅔ"], "네": ["ㄴㅔ"], "데": ["ㄷㅔ", "⊂ㅔ"], "레": ["ㄹㅔ", "己ㅔ"], "메": ["ㅁㅔ", "口ㅔ"],
      "마": ["ㅁr", "口r", "㉤r"], "미": ["ㅁl", "口l"], "라": ["ㄹr", "己r"], "리": ["ㄹl", "己l"], "가": ["ㄱr", "ㄱト"], "기": ["ㄱl"], "까": ["ㄲr"],

  function outSize() {

  // 필터 + 낮은 화질(JPEG 깍두기)은 사진이 바뀔 때만 다시 만들어요. 문구만 바꾸면 위에 다시 쓰기만 해요.
  async function render() {

  function wrap(x, text, maxW) {

    }

  }

  let fontWait = "";
  function compose() {
    if (!photo) return;
    const out = $("#out"), w = photo.width, h = photo.height;
    const text = finalText($("#txt").value.replace(/\s+$/, ""));
    $("#toneV").textContent = TONES[+$("#tone").value][1];
    const pos = val("pos"), place = val("place"), align = val("align");
    $("#bgRow").hidden = place !== "pad";
    const fam = FONT[val("font")], weight = val("font") === "dot" ? 400 : 700;
    $("#fsV").textContent = $("#fs").value;
    let fs = Math.max(10, Math.round(Math.min(w, h * 1.33) * +$("#fs").value / 100));
    const m = mk(1, 1).getContext("2d");
    let lines = [], CW = w, CH = h, box = null, fontStr = "", lh = 0, pad = 0, tw = 0, th = 0;
    const lay = () => {
      fontStr = `${weight} ${fs}px ${fam}`; m.font = fontStr;
      pad = Math.round(fs * .8); lh = Math.round(fs * 1.35);
      const areaW = pos === "bottom" ? w - pad * 2 : (place === "over" ? w * .46 : w * .6);

  function thumbs() {

  async function add(files) {

    if (!imgs.length) { say("사진 파일만 올릴 수 있어요.", "err"); return; }

    const next = Math.min(i, items.length - 1);
    if (i === cur) { cur = -1; select(next); } else { if (i < cur) cur--; drawStrip(); }
  }
  $("#pstrip").onclick = e => {
    if (e.target.closest("#padd")) { $("#file").click(); return; }
    const x = e.target.closest("[data-x]"); if (x) { e.stopPropagation(); removeAt(+x.dataset.x); return; }
    const b = e.target.closest(".pth"); if (b && +b.dataset.i !== cur) select(+b.dataset.i);
  };
  $("#saveAll").onclick = async () => {
    const keep = cur, files = [], used = {};
    $("#saveAll").disabled = true;
    for (let i = 0; i < items.length; i++) {
      say(`${i + 1} / ${items.length}장 만드는 중…`);
      await select(i);
      const blob = await new Promise(r => $("#out").toBlob(r, "image/jpeg", .92));
      let n = name + "_하두리"; used[n] = (used[n] || 0) + 1; if (used[n] > 1) n += "_" + used[n];
      files.push({ blob, name: n + ".jpg" });
    }
    await select(keep);
    await TT.downloadZip(files, "하두리.zip");
    $("#saveAll").disabled = false; say(`${files.length}장을 ZIP으로 저장했어요.`, "ok");
  };

  let tId = 0;
  const textChanged = () => { clearTimeout(tId); tId = setTimeout(compose, 60); };
  TT.dropzone($("#drop"), add, { accept: "image/*", multiple: true });
  $("#txt").addEventListener("input", textChanged);
  ["#q", "#banner", "#lsize"].forEach(s => $(s).addEventListener("input", render));
  document.querySelectorAll("input[name=lpos]").forEach(el => el.addEventListener("change", render));
  document.querySelectorAll("input[name=size]").forEach(el => el.addEventListener("change", render));
  ["#stroke", "#fs", "#tone", "#dots"].forEach(s => $(s).addEventListener("input", compose));
  document.querySelectorAll("input[name=font]").forEach(el => el.addEventListener("change", compose));
  document.querySelectorAll("input[name=pos],input[name=place],input[name=align]").forEach(el => el.addEventListener("change", compose));
  $("#shuffle").onclick = () => { CY.setSeed((CY.getSeed() * 48271 + 11) % 2147483647); if ($("#tone").value === "0") $("#tone").value = "2"; compose(); };
  $("#copyCy").onclick = async () => {
    const t = finalText($("#txt").value);
    if (!t.trim()) { say("먼저 문구를 적어 주세요."); return; }
    try { await navigator.clipboard.writeText(t); say("바뀐 글을 복사했어요.", "ok"); } catch { say("복사하지 못했어요. 글을 직접 골라 복사해 주세요.", "err"); }
  };
  $("#save").onclick = () => $("#out").toBlob(b => { TT.download(b, name + "_하두리.jpg"); say("저장했어요.", "ok"); }, "image/jpeg", .92);

})();
</script>
