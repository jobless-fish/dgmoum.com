<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../site.webmanifest">
<meta name="theme-color" content="#f0f0f0">
<meta property="og:site_name" content="도구모음">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dgmoum.com/assets/og-image.png">
<meta property="og:title" content="글자 수 세기 · 도구모음">
<meta property="og:description" content="자기소개서·리포트 글자수 세기. 공백 포함, 공백 제외, 바이트(UTF-8·EUC-KR), 단어, 줄 수를 실시간으로. 목표 글자 수까지 남은 글자 표시.">
<title>글자 수 세기 · 도구모음</title>
<meta name="description" content="자기소개서·리포트 글자수 세기. 공백 포함, 공백 제외, 바이트(UTF-8·EUC-KR), 단어, 줄 수를 실시간으로. 목표 글자 수까지 남은 글자 표시.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  body { --cat: var(--txt); }
  .editor { padding: 0; display: grid; }
  .editor textarea {
    width: 100%; min-height: 52vh; resize: vertical; border: 0; background: transparent; padding: 20px;
    font: 16px/1.8 var(--f-body); color: var(--ink); border-radius: var(--r);
  }
  .editor textarea:focus-visible { outline: none; }
  .editor:focus-within { border-color: var(--txt); }
  .edit-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; }
  .edit-bar .spacer { flex: 1; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .big span { display: block; font-size: 12px; color: var(--muted); }
  .big b { font-family: var(--f-mono); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stats { display: grid; gap: 0; margin: 0; }
  .stats div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .stats div:last-child { border-bottom: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
  .goal { display: grid; gap: 8px; }
  .goal .row input { max-width: 120px; }
  .meter { height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--txt); transition: width .15s; }
  .meter.over i { background: var(--err); }
  .left { font-size: 14px; font-weight: 600; }
  .left.over { color: var(--err); }
  .left.ok { color: var(--ok); }
  .sms { font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="../../"><img class="brand-logo" src="../../assets/logo.png" alt="도구모음" width="168" height="58"></a>
    <nav class="crumb"><span>/</span><strong>글자 수 세기</strong></nav>
    <span class="spacer"></span>
    <span class="privacy-pill">입력한 글은 저장·전송되지 않아요</span>
  </div>
</header>

<main class="wrap">
  <div class="tool-head">
    <span class="tool-tag" data-icon="char-count"></span>
    <div>
      <h1>글자 수 세기</h1>
      <p>자기소개서, 리포트, 공모전 원고를 붙여넣으면 바로 세요. 사이트마다 기준이 달라서 공백 포함·제외와 바이트를 함께 보여줘요.</p>
    </div>
  </div>

  <div class="workspace">
    <section style="display:grid; gap:14px; min-width:0">
      <div class="panel editor">
        <textarea id="t" spellcheck="false" aria-label="글 입력" placeholder="여기에 글을 쓰거나 붙여넣으세요."></textarea>
        <div class="edit-bar">
          <button class="btn btn-sm" id="trimSpaces">겹친 공백 하나로</button>
          <button class="btn btn-sm" id="trimLines">빈 줄 지우기</button>
          <button class="btn btn-sm" id="copy">전체 복사</button>
          <span class="spacer"></span>
          <button class="btn btn-sm" id="clear">지우기</button>
        </div>
      </div>
      <div class="ad-slot" id="ad-main"></div>
    </section>

    <aside class="panel side">
      <div class="panel-body">
        <div class="big">
          <div><span>공백 포함</span><b id="withSp">0</b></div>
          <div><span>공백 제외</span><b id="noSp">0</b></div>
        </div>
        <dl class="stats">
          <div><dt>바이트 (UTF-8)</dt><dd id="utf8">0</dd></div>
          <div><dt>바이트 (한글 2바이트)</dt><dd id="euckr">0</dd></div>
          <div><dt>단어</dt><dd id="words">0</dd></div>
          <div><dt>줄</dt><dd id="lines">0</dd></div>
          <div><dt>문단</dt><dd id="paras">0</dd></div>
          <div><dt>원고지 (200자)</dt><dd id="sheets">0</dd></div>
        </dl>
        <label class="check"><input type="checkbox" id="nl" checked> 줄바꿈도 한 글자로 세기</label>
        <p class="hint">채용 사이트마다 줄바꿈을 세는 방식이 달라요. 제출할 곳의 기준을 확인하세요.</p>

        <div class="goal">
          <h2>목표 글자 수</h2>
          <div class="row">
            <input type="number" id="goal" min="1" placeholder="예: 1000" aria-label="목표 글자 수">
            <select id="base" aria-label="기준">
              <option value="with">공백 포함</option>
              <option value="no">공백 제외</option>
              <option value="euckr">바이트 (한글 2)</option>
              <option value="utf8">바이트 (UTF-8)</option>
            </select>
          </div>
          <div class="meter" id="meter"><i></i></div>
          <p class="left" id="left">목표를 넣으면 남은 글자를 알려줘요.</p>
        </div>
        <p class="sms" id="sms"></p>
      </div>
    </aside>
  </div>
</main>

<footer class="foot"><div class="wrap"><span>입력한 글은 이 화면에서만 세고 어디에도 보내지 않아요.</span><a href="../../">다른 도구 보기</a></div></footer>

<script src="../../assets/common.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const t = $("#t");
  const enc = new TextEncoder();
  const fmt = n => n.toLocaleString("ko-KR");
  const GOAL_KEY = "tt-charcount-goal";

  // 목표 설정은 이 기기에만 기억 (글 내용은 저장하지 않음)
  try { const g = JSON.parse(localStorage.getItem(GOAL_KEY) || "null"); if (g) { $("#goal").value = g.goal || ""; $("#base").value = g.base || "with"; } } catch {}

  function count() {
    let s = t.value;
    const chars = Array.from(s); // 이모지·한글 조합도 한 글자로
    const nlCount = chars.filter(c => c === "\n").length;
    const withSp = chars.length - ($("#nl").checked ? 0 : nlCount);
    const noSp = chars.filter(c => !/\s/.test(c)).length;
    const utf8 = enc.encode(s.replace(/\r/g, "")).length;
    let euckr = 0; for (const c of chars) euckr += c.codePointAt(0) < 128 ? 1 : 2;
    const words = (s.trim().match(/\S+/g) || []).length;
    const lines = s ? s.split("\n").length : 0;
    const paras = s.split(/\n\s*\n/).filter(p => p.trim()).length;
    const v = { with: withSp, no: noSp, utf8, euckr };

    $("#withSp").textContent = fmt(withSp); $("#noSp").textContent = fmt(noSp);
    $("#utf8").textContent = fmt(utf8); $("#euckr").textContent = fmt(euckr);
    $("#words").textContent = fmt(words); $("#lines").textContent = fmt(lines); $("#paras").textContent = fmt(paras);
    $("#sheets").textContent = (withSp / 200).toFixed(1) + "장";
    $("#sms").textContent = euckr === 0 ? "" : euckr <= 90 ? `문자 메시지로 보내면 단문(SMS, 90바이트 이하)이에요.` : euckr <= 2000 ? `문자 메시지로 보내면 장문(LMS, 2,000바이트 이하)이에요.` : `문자 메시지 장문 한도(2,000바이트)를 넘어요.`;

    const goal = +$("#goal").value, base = $("#base").value;
    const meter = $("#meter"), left = $("#left");
    if (goal > 0) {
      const cur = v[base], unit = base.startsWith("utf8") || base === "euckr" ? "바이트" : "자";
      meter.firstElementChild.style.width = Math.min(100, cur / goal * 100) + "%";
      meter.classList.toggle("over", cur > goal);
      if (cur > goal) { left.textContent = `${fmt(cur - goal)}${unit} 넘었어요`; left.className = "left over"; }
      else { left.textContent = `${fmt(goal - cur)}${unit} 남았어요 (${Math.floor(cur / goal * 100)}%)`; left.className = "left" + (cur >= goal * 0.9 ? " ok" : ""); }
    } else { meter.firstElementChild.style.width = 0; meter.classList.remove("over"); left.textContent = "목표를 넣으면 남은 글자를 알려줘요."; left.className = "left"; }
  }
  t.addEventListener("input", count);
  $("#nl").addEventListener("change", count);
  ["#goal", "#base"].forEach(s => $(s).addEventListener("input", () => {
    count();
    try { localStorage.setItem(GOAL_KEY, JSON.stringify({ goal: $("#goal").value, base: $("#base").value })); } catch {}
  }));

  const edit = fn => { t.value = fn(t.value); count(); t.focus(); };
  $("#trimSpaces").onclick = () => edit(s => s.replace(/[ \t ]{2,}/g, " ").replace(/[ \t]+\n/g, "\n"));
  $("#trimLines").onclick = () => edit(s => s.replace(/\n\s*\n+/g, "\n"));
  $("#clear").onclick = () => edit(() => "");
  $("#copy").onclick = async () => {
    const b = $("#copy");
    try { await navigator.clipboard.writeText(t.value); b.textContent = "복사했어요"; }
    catch { t.select(); b.textContent = "Ctrl+C로 복사하세요"; }
    setTimeout(() => b.textContent = "전체 복사", 1500);
  };
  count();
})();
</script>
</body>
</html>
