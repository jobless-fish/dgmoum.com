<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 보정 (라이트룸처럼) · 뚝딱툴</title>
<meta name="description" content="설치 없이 브라우저에서 라이트룸처럼 사진을 보정해요. 노출·대비·색온도, 톤 곡선, 색상별 HSL, 색 보정, 그레인, 필름 프리셋(Portra·Tri-X 느낌), LUT 불러오기, 여러 장 한 번에. 업로드 없이 무료.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  /* 라이트룸처럼 늘 어두운 작업 화면 */
  body.pe {
    --pb: #121314; --p1: #1f2022; --p2: #2a2b2e; --p3: #35373a; --pl: #3c3e42; --pt: #d6d6d6; --pm: #8e9196; --pk: #e6e6e6;
    background: var(--pb); color: var(--pt); color-scheme: dark; margin: 0;
  }
  .pe a { color: var(--pt); }
  .pe button { font: inherit; color: inherit; }
  .phead { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--p1); border-bottom: 1px solid #000; }
  .phead .brand-mark { font-size: 18px; }
  .phead h1 { font-size: 14px; font-weight: 600; margin: 0; color: var(--pt); white-space: nowrap; }
  .phead .sp { flex: 1; }
  .tb { display: flex; gap: 4px; align-items: center; }
  .pbtn { background: var(--p2); border: 1px solid var(--pl); border-radius: 4px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; white-space: nowrap; color: var(--pt); }
  .pbtn:hover:not(:disabled) { background: var(--p3); }
  .pbtn:disabled { opacity: .4; cursor: default; }
  .pbtn[aria-pressed=true] { background: var(--pk); color: #111; border-color: var(--pk); }
  .pbtn.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr) 310px; height: calc(100vh - 48px); height: calc(100dvh - 48px); min-height: 520px; }
  .lp, .rp { background: var(--p1); overflow-y: auto; scrollbar-width: thin; }
  .lp { border-right: 1px solid #000; }
  .rp { border-left: 1px solid #000; }
  .center { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }

  /* 보기 */
  .view { position: relative; overflow: hidden; display: grid; place-items: center; background: var(--pb); min-height: 0; }
  .view.zoom { overflow: auto; place-items: start; cursor: grab; }
  .view canvas { display: block; max-width: calc(100% - 32px); max-height: calc(100% - 32px); box-shadow: 0 0 0 1px #000, 0 6px 30px rgba(0,0,0,.6); }
  .view.zoom canvas { max-width: none; max-height: none; margin: 16px; }
  .view .empty { display: grid; gap: 10px; justify-items: center; text-align: center; padding: 40px 20px; border: 1px dashed var(--pl); border-radius: 10px; cursor: pointer; color: var(--pm); max-width: 420px; }
  .view .empty strong { color: var(--pt); font-size: 16px; }
  .view .empty svg { width: 34px; height: 34px; }
  .view.over .empty { border-color: var(--accent); }
  .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.65); padding: 3px 9px; border-radius: 3px; font-size: 12px; pointer-events: none; }
  .split { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); cursor: ew-resize; touch-action: none; }
  .split::before { content: ""; position: absolute; left: -14px; right: -14px; top: 0; bottom: 0; }
  .split span { position: absolute; top: 10px; font-size: 11px; background: rgba(0,0,0,.65); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .split .l { right: 8px; } .split .r { left: 8px; }

  /* 필름스트립 */
  .strip { display: flex; gap: 6px; align-items: center; padding: 6px 8px; background: var(--p1); border-top: 1px solid #000; overflow-x: auto; min-height: 76px; scrollbar-width: thin; }
  .strip .th { position: relative; flex: none; height: 60px; border: 2px solid transparent; border-radius: 3px; cursor: pointer; background: #000; }
  .strip .th img { height: 100%; display: block; border-radius: 1px; }
  .strip .th.on { border-color: var(--pk); }
  .strip .th.edited::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px #000; }
  .strip .add { flex: none; width: 60px; height: 60px; border: 1px dashed var(--pl); border-radius: 3px; background: none; cursor: pointer; font-size: 22px; color: var(--pm); }
  .strip .acts { display: flex; gap: 4px; margin-left: auto; flex: none; padding-left: 8px; }

  /* 패널 */
  .sec { border-bottom: 1px solid #000; }
  .sec > h2 { all: unset; display: flex; align-items: center; justify-content: space-between; gap: 6px; box-sizing: border-box; width: 100%; padding: 9px 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .02em; cursor: pointer; background: var(--p2); color: var(--pt); user-select: none; }
  .sec > h2::after { content: "▾"; font-size: 11px; color: var(--pm); }
  .sec.closed > h2::after { content: "▸"; }
  .sec.closed > .body { display: none; }
  .sec > .body { padding: 10px 12px 14px; display: grid; gap: 7px; }
  .sub { font-size: 11.5px; color: var(--pm); margin: 6px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .sub:first-child { margin-top: 0; }
  .sl { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px; gap: 8px; align-items: center; font-size: 12.5px; }
  .sl label { color: var(--pt); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sl input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: transparent; margin: 0; cursor: pointer; }
  .sl input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--trk, #55585d); }
  .sl input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--trk, #55585d); }
  .sl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: var(--pk); margin-top: -4px; border: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  .sl input[type=range]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--pk); border: 0; }
  .sl input[type=range]:focus-visible { outline: 1px solid var(--accent); }
  .sl .nv { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 3px; color: var(--pt); font: 12px var(--f-mono); text-align: right; padding: 2px 3px; }
  .sl .nv:hover, .sl .nv:focus { border-color: var(--pl); background: var(--pb); outline: 0; }
  .sl.changed label { color: #fff; }
  .seg2 { display: flex; border: 1px solid var(--pl); border-radius: 4px; overflow: hidden; }
  .seg2 button { flex: 1; background: var(--p2); border: 0; padding: 5px 4px; font-size: 12px; cursor: pointer; color: var(--pm); }
  .seg2 button + button { border-left: 1px solid var(--pl); }
  .seg2 button[aria-pressed=true] { background: var(--p3); color: #fff; }
  .row2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .psel { background: var(--p2); color: var(--pt); border: 1px solid var(--pl); border-radius: 4px; padding: 4px 6px; font-size: 12.5px; min-width: 0; flex: 1; }
  .hint2 { font-size: 11.5px; color: var(--pm); line-height: 1.5; margin: 0; }

  #histo { width: 100%; height: 100px; display: block; background: #0d0d0e; border-radius: 2px; }
  .hinfo { display: flex; justify-content: space-between; font: 11px var(--f-mono); color: var(--pm); margin-top: 4px; }
  #curve { width: 100%; aspect-ratio: 1; display: block; background: #0d0d0e; border-radius: 2px; touch-action: none; cursor: crosshair; }

  .wheels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center; }
  .wheel { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; touch-action: none; cursor: pointer;
    background: radial-gradient(circle, #8a8a8a 0%, rgba(138,138,138,0) 70%), conic-gradient(from 0deg, hsl(0 70% 50%), hsl(60 70% 50%), hsl(120 70% 50%), hsl(180 70% 50%), hsl(240 70% 50%), hsl(300 70% 50%), hsl(360 70% 50%)); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); }
  .wheel i { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #000; pointer-events: none; }
  .wcap { font-size: 11.5px; color: var(--pm); margin-top: 4px; }
  .wval { font: 10.5px var(--f-mono); color: var(--pt); }

  /* 프리셋 */
  .pgrp > h2 { background: var(--p1); }
  .pgrp .body { padding: 2px 0 8px; gap: 0; }
  .pi { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 6px 12px 6px 20px; cursor: pointer; color: var(--pt); font-size: 12.5px; position: relative; }
  .pi:hover, .pi:focus-visible { background: var(--p3); outline: 0; }
  .pi.on { background: var(--pk); color: #111; }
  .pi small { display: block; color: var(--pm); font-size: 11px; margin-top: 1px; }
  .pi.on small { color: #444; }
  .pi .x { position: absolute; right: 8px; top: 6px; font-size: 12px; color: var(--pm); padding: 0 4px; }
  .mysave { display: flex; gap: 4px; padding: 6px 12px; }
  .mysave input { flex: 1; min-width: 0; background: var(--pb); border: 1px solid var(--pl); color: var(--pt); border-radius: 4px; padding: 4px 6px; font-size: 12px; }
  .legal { padding: 10px 12px 16px; font-size: 11px; color: var(--pm); line-height: 1.5; }

  /* 내보내기 창 */
  .pop { position: fixed; right: 12px; top: 54px; width: 300px; max-width: calc(100vw - 24px); background: var(--p2); border: 1px solid #000; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.6); padding: 14px; display: grid; gap: 10px; z-index: 20; }
  .pop[hidden] { display: none; }
  .pop h3 { margin: 0; font-size: 14px; }
  .pop .bar { height: 4px; background: var(--pb); border-radius: 2px; overflow: hidden; }
  .pop .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .pst { font-size: 12px; color: var(--pm); min-height: 1em; margin: 0; }
  .pst.err { color: #ff8a8a; } .pst.ok { color: #7fd8a0; }

  .mtabs { display: none; }
  .below { background: var(--pb); padding: 20px 0 32px; }
  .below .ad-slot { margin: 0 auto; }
  .below .foot { background: transparent; border: 0; color: var(--pm); }

  @media (max-width: 1100px) { .app { grid-template-columns: 210px minmax(0, 1fr) 290px; } }
  @media (max-width: 900px) {
    .phead { height: auto; min-height: 48px; flex-wrap: wrap; padding: 6px 10px; }
    .phead h1 { display: none; }
    .app { display: block; height: auto; }
    .center { height: 58vh; height: 58dvh; position: sticky; top: 0; z-index: 5; }
    .mtabs { display: flex; position: sticky; top: 58vh; top: 58dvh; z-index: 5; background: var(--p1); border-bottom: 1px solid #000; }
    .mtabs button { flex: 1; background: none; border: 0; padding: 10px; color: var(--pm); font-size: 13px; cursor: pointer; }
    .mtabs button[aria-pressed=true] { color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
    .lp, .rp { border: 0; overflow: visible; }
    .app[data-tab=edit] .lp, .app[data-tab=preset] .rp { display: none; }
    .tb .lab { display: none; }
    .strip { min-height: 64px; } .strip .th { height: 48px; } .strip .add { width: 48px; height: 48px; }
  }
</style>
</head>
<body class="pe">
<header class="phead">
  <a class="brand" href="../../"><span class="brand-mark">뚝딱툴</span></a>
  <h1>사진 보정</h1>
  <span class="sp"></span>
  <div class="tb">
    <button class="pbtn" id="bBefore" title="보정 전 보기 ( \ )" aria-pressed="false" disabled>전<span class="lab"> · 후</span></button>
    <button class="pbtn" id="bSplit" title="반반 비교 ( Y )" aria-pressed="false" disabled>반반<span class="lab"> 비교</span></button>
    <button class="pbtn" id="bZoom" title="맞춤 / 1:1 ( Z )" aria-pressed="false" disabled>1:1</button>
  </div>
  <div class="tb">
    <button class="pbtn" id="bUndo" title="되돌리기 (Ctrl+Z)" disabled>↶</button>
    <button class="pbtn" id="bRedo" title="다시 하기 (Ctrl+Shift+Z)" disabled>↷</button>
    <button class="pbtn" id="bReset" title="모든 보정 초기화" disabled>초기화</button>
    <button class="pbtn go" id="bExport" disabled>내보내기</button>
  </div>
</header>

<div class="app" id="app" data-tab="edit">
  <aside class="lp" id="lp" aria-label="프리셋"></aside>

  <section class="center">
    <div class="view" id="view">
      <div class="empty" id="empty" tabindex="0" role="button">
        <span data-icon="upload"></span>
        <strong>사진을 끌어다 놓거나 눌러서 고르세요</strong>
        <span>JPG · PNG · WEBP · 여러 장 한 번에 · 붙여넣기도 돼요</span>
      </div>
      <canvas id="cv" hidden></canvas>
      <span class="badge" id="badge" hidden>보정 전</span>
      <div class="split" id="split" hidden><span class="l">전</span><span class="r">후</span></div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <div class="strip" id="strip" hidden>
      <div id="thumbs" style="display:contents"></div>
      <button class="add" id="add" title="사진 더 넣기">+</button>
      <div class="acts">
        <button class="pbtn" id="bCopy" title="이 사진의 보정값 복사">복사</button>
        <button class="pbtn" id="bPaste" title="복사한 보정값 붙여넣기" disabled>붙여넣기</button>
        <button class="pbtn" id="bSync" title="이 보정값을 모든 사진에">모두에 적용</button>
      </div>
    </div>
  </section>

  <nav class="mtabs" aria-label="패널">
    <button id="tPreset" aria-pressed="false">프리셋</button>
    <button id="tEdit" aria-pressed="true">보정</button>
  </nav>

  <aside class="rp" id="rp" aria-label="보정"></aside>
</div>

<div class="pop" id="pop" hidden role="dialog" aria-label="내보내기">
  <h3>내보내기</h3>
  <div class="sub">형식</div>
  <div class="seg2" id="eFmt"><button data-v="jpg" aria-pressed="true">JPG</button><button data-v="png" aria-pressed="false">PNG</button><button data-v="webp" aria-pressed="false">WEBP</button></div>
  <div class="sl" id="eQRow"><label>화질</label><input type="range" id="eQ" min="60" max="100" value="92"><input class="nv" id="eQv" value="92" aria-label="화질 값"></div>
  <div class="sub">크기</div>
  <select class="psel" id="eSize"><option value="0">원본 크기</option><option value="4000">긴 변 4000px</option><option value="2048">긴 변 2048px (SNS 고화질)</option><option value="1080">긴 변 1080px (인스타)</option></select>
  <label class="row2" style="font-size:12.5px"><input type="checkbox" id="eExif"> 촬영 정보(EXIF) 남기기 · JPG만</label>
  <p class="hint2">촬영 위치(GPS)가 들어 있을 수 있어요. 공유할 사진이면 끄는 게 안전해요.</p>
  <div class="sub">대상</div>
  <div class="seg2" id="eWho"><button data-v="one" aria-pressed="true">이 사진</button><button data-v="all" aria-pressed="false">모든 사진</button></div>
  <div class="row2"><button class="pbtn go" id="eRun" style="flex:1">저장하기</button><button class="pbtn" id="eClose">닫기</button></div>
  <div class="bar"><i id="eBar"></i></div>
  <p class="pst" id="eSt"></p>
</div>

<div class="below">
  <div class="ad-slot" id="ad-main"></div>
  <footer class="foot"><div class="wrap"><span>사진은 이 브라우저 안에서만 처리돼요. 단축키: \ 보정 전 · Y 반반 · Z 확대 · Ctrl+Z 되돌리기 · 이름 두 번 누르면 그 값만 초기화</span><a href="../../">다른 도구 보기</a></div></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../../assets/common.js"></script>
<script src="presets.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
