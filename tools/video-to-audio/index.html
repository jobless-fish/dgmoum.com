<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영상에서 소리 추출 · 뚝딱툴</title>
<meta name="description" content="MP4, MOV, WEBM 동영상에서 소리만 뽑아 MP3나 WAV로 저장. 여러 개 한 번에. 업로드 없이 브라우저에서.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  body { --cat: var(--aud); }
  .file .thumb { display: grid; place-items: center; color: var(--aud); background: color-mix(in srgb, var(--aud) 12%, var(--surface)); }
  .file .thumb svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="../../"><span class="brand-mark">뚝딱툴</span></a>
    <nav class="crumb"><span>/</span><strong>영상에서 소리 추출</strong></nav>
    <span class="spacer"></span>
    <span class="privacy-pill">업로드 없음</span>
  </div>
</header>

<main class="wrap">
  <div class="tool-head">
    <span class="tool-tag" data-icon="video-to-audio"></span>
    <div>
      <h1>영상에서 소리 추출</h1>
      <p>영상 파일에서 소리만 뽑아 MP3로 저장해요. 강의·인터뷰 녹화본을 음성 파일로 바꿀 때 쓰세요.</p>
    </div>
  </div>

  <div class="workspace">
    <section style="display:grid; gap:14px; min-width:0">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="파일 선택">
        <span data-icon="upload"></span>
        <strong>영상 파일을 끌어다 놓거나 눌러서 고르세요</strong>
        <span>MP4 · MOV · WEBM · 여러 개 가능</span>
        <input type="file" id="file">
      </div>
      <div id="listWrap" hidden>
        <div class="list-head">
          <p id="summary"></p>
          <button class="btn btn-sm" id="clear">모두 비우기</button>
        </div>
        <div class="files" id="files"></div>
      </div>
      <div class="ad-slot" id="ad-main"></div>
    </section>

    <aside class="panel side">
      <div class="panel-body">
        <h2>변환 설정</h2>
        <div class="field">
          <span class="label">저장 형식</span>
          <div class="seg" role="radiogroup">
            <input type="radio" name="fmt" id="f-mp3" value="mp3" checked><label for="f-mp3">MP3</label>
            <input type="radio" name="fmt" id="f-wav" value="wav"><label for="f-wav">WAV</label>
          </div>
          <p class="hint">MP3는 가볍고 어디서나 재생돼요. WAV는 음질 손실이 없지만 파일이 커요.</p>
        </div>
        <div class="field" id="brField">
          <label for="br">MP3 음질</label>
          <select id="br">
            <option value="320">320 kbps (최고)</option>
            <option value="192" selected>192 kbps (보통)</option>
            <option value="128">128 kbps (가볍게)</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="mono"> 모노로 합치기 (음성·강의라면 용량이 절반)</label>
        <button class="btn btn-primary btn-block" id="run" disabled>변환하기</button>
        <div class="progress" id="prog" hidden><i></i></div>
        <p class="status" id="status"></p>
        <button class="btn btn-block" id="zip" hidden data-icon="download"> 전부 zip으로 받기</button>
      </div>
    </aside>
  </div>
</main>

<footer class="foot"><div class="wrap"><span>파일은 이 브라우저 안에서만 처리돼요.</span><a href="../../">다른 도구 보기</a></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../../assets/audio.js"></script>
<script src="../../assets/common.js"></script>
<script>
(() => {

  const fmt = () => document.querySelector("input[name=fmt]:checked").value;
  if (!window.lamejs) { document.getElementById("f-wav").checked = true; document.getElementById("f-mp3").disabled = true; }
  const syncFmt = () => { document.getElementById("brField").hidden = fmt() !== "mp3"; };
  document.querySelectorAll("input[name=fmt]").forEach(r => r.addEventListener("change", () => { syncFmt(); if (typeof stale === "function") stale(); }));
  syncFmt();

  const $ = s => document.querySelector(s);
  const filesEl = $("#files"), runBtn = $("#run"), zipBtn = $("#zip"), prog = $("#prog"), bar = prog.firstElementChild;
  const say = TT.sayTo($("#status"));
  const items = [];

  TT.dropzone($("#drop"), add, { accept: "video/*,.mkv,.mov" });

  function add(files) {
    for (const file of files) {
      const it = { file, url: URL.createObjectURL(file) };
      items.push(it); filesEl.appendChild(row(it));
      // 길이만 먼저 가볍게 읽어요
      const m = document.createElement(file.type.startsWith("video/") ? "video" : "audio");
      m.preload = "metadata"; m.src = it.url;
      m.onloadedmetadata = () => { it.dur = m.duration; info(it); };
      m.onerror = () => info(it);
    }
    refresh();
  }
  function row(it) {
    const el = document.createElement("div"); el.className = "file";
    el.innerHTML = `<div class="thumb">${TT.icon("video-to-audio")}</div>
      <div class="meta"><div class="name"></div><div class="info"></div></div>
      <div class="acts"><button class="icon-btn dl" title="받기" hidden>${TT.icon("download")}</button><button class="icon-btn rm" title="빼기">${TT.icon("x")}</button></div>`;
    el.querySelector(".name").textContent = it.file.name;
    el.querySelector(".rm").onclick = () => { URL.revokeObjectURL(it.url); items.splice(items.indexOf(it), 1); el.remove(); refresh(); };
    el.querySelector(".dl").onclick = () => it.out && TT.download(it.out.blob, it.out.name);
    it.el = el; info(it); return el;
  }
  function info(it) {
    const el = it.el?.querySelector(".info"); if (!el) return;
    el.innerHTML = `${isFinite(it.dur) ? TT.time(it.dur, 0) + " · " : ""}${TT.bytes(it.file.size)}${it.res || ""}`;
  }
  function refresh() {
    $("#listWrap").hidden = !items.length; runBtn.disabled = !items.length;
    $("#summary").textContent = `${items.length}개 파일 · ${TT.bytes(items.reduce((s, i) => s + i.file.size, 0))}`;
    zipBtn.hidden = !(items.length > 1 && items.every(i => i.out));
  }
  function stale() { items.forEach(i => { i.out = null; i.res = ""; i.el.querySelector(".dl").hidden = true; info(i); }); refresh(); }
  $("#mono").addEventListener("change", stale); $("#br").addEventListener("change", stale);
  $("#clear").onclick = () => { items.forEach(i => URL.revokeObjectURL(i.url)); items.length = 0; filesEl.innerHTML = ""; refresh(); say(""); };

  runBtn.onclick = async () => {
    runBtn.disabled = true; prog.hidden = false; zipBtn.hidden = true;
    let done = 0, failed = 0;
    for (const it of items) {
      const base = done / items.length, part = 1 / items.length;
      try {
        say(`소리를 읽는 중… ${done + 1}/${items.length}`);
        const buf = await TA.decode(it.file);
        let chs = TA.chans(buf); if ($("#mono").checked) chs = TA.mono(chs);
        say(`${fmt().toUpperCase()}로 만드는 중… ${done + 1}/${items.length}`);
        const blob = await TA.encode(chs, buf.sampleRate, fmt(), +$("#br").value, p => bar.style.width = ((base + p * part) * 100) + "%");
        it.out = { blob, name: `${TT.baseName(it.file.name)}.${TA.ext(fmt())}` };
        it.res = ` → <b>${fmt().toUpperCase()} ${TT.bytes(blob.size)}</b>`;
        it.el.querySelector(".dl").hidden = false;
      } catch (e) { console.error(e); failed++; it.res = ` → 소리가 없거나 이 브라우저가 열 수 없는 영상이에요`; }
      info(it); done++; bar.style.width = (done / items.length * 100) + "%";
    }
    prog.hidden = true; bar.style.width = 0; runBtn.disabled = false;
    const ok = items.filter(i => i.out);
    say(failed ? `${ok.length}개 완료 · ${failed}개 실패` : `${ok.length}개 완료`, failed && !ok.length ? "err" : "ok");
    if (ok.length === 1) TT.download(ok[0].out.blob, ok[0].out.name);
    refresh();
  };
  zipBtn.onclick = () => TT.downloadZip(items.filter(i => i.out).map(i => i.out), `${fmt()}.zip`);

})();
</script>
</body>
</html>
