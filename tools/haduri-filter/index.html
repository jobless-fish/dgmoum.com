<script>
(() => {

  const $ = s => document.querySelector(s);
  const say = TT.sayTo($("#status"));
  const val = n => document.querySelector(`input[name=${n}]:checked`).value;

  // ── 필터: CSS filter와 같은 계산을 픽셀에 직접 해요 (사파리에서도 똑같이 나오게)
  const FILTERS = [
    ["원본", [], 0],
    ["뽀샤시", [["sepia", .08], ["contrast", .84], ["brightness", 1.35]], .5],
    ["더 뽀샤시", [["sepia", .1], ["saturate", .9], ["contrast", .78], ["brightness", 1.6]], .7],
    ["하얀 피부", [["saturate", .85], ["contrast", .74], ["brightness", 1.85]], .6],
    ["분홍 셀카", [["hue", -18], ["saturate", 1.15], ["contrast", .86], ["brightness", 1.4]], .5],
    ["추억 세피아", [["sepia", .4], ["contrast", .9], ["brightness", 1.25]], .4],
    ["누런 사진", [["sepia", .65], ["hue", -8], ["contrast", .84], ["brightness", 1.45]], .5],
    ["초록 웹캠", [["sepia", .1], ["hue", 32], ["saturate", .55], ["contrast", .82], ["brightness", 1.55]], .7],
    ["진초록 웹캠", [["sepia", .12], ["hue", 52], ["saturate", .75], ["contrast", .8], ["brightness", 1.5]], .9],
    ["푸른 밤", [["sepia", .2], ["hue", 165], ["saturate", .7], ["contrast", .9], ["brightness", 1.15]], .5],
    ["흑백", [["gray", 1], ["contrast", .9], ["brightness", 1.3]], .4],
    ["하얀 흑백", [["gray", 1], ["contrast", .84], ["brightness", 1.8]], .5],
  ];
  function matrix(k, a) {
    if (k === "sepia") { const b = 1 - a; return [.393 + .607 * b, .769 - .769 * b, .189 - .189 * b, .349 - .349 * b, .686 + .314 * b, .168 - .168 * b, .272 - .272 * b, .534 - .534 * b, .131 + .869 * b]; }
    if (k === "gray") { const b = 1 - a; return [.2126 + .7874 * b, .7152 - .7152 * b, .0722 - .0722 * b, .2126 - .2126 * b, .7152 + .2848 * b, .0722 - .0722 * b, .2126 - .2126 * b, .7152 - .7152 * b, .0722 + .9278 * b]; }
    if (k === "saturate") return [.213 + .787 * a, .715 - .715 * a, .072 - .072 * a, .213 - .213 * a, .715 + .285 * a, .072 - .072 * a, .213 - .213 * a, .715 - .715 * a, .072 + .928 * a];
    if (k === "hue") { const r = a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
      return [.213 + c * .787 - s * .213, .715 - c * .715 - s * .715, .072 - c * .072 + s * .928,
              .213 - c * .213 + s * .143, .715 + c * .285 + s * .140, .072 - c * .072 - s * .283,
              .213 - c * .213 - s * .787, .715 - c * .715 + s * .715, .072 + c * .928 + s * .072]; }
    return null;
  }
  function applyOps(img, ops) {
    if (!ops.length) return;
    const steps = ops.map(([k, a]) => ({ k, a, m: matrix(k, a) }));
    const d = img.data, cl = v => v < 0 ? 0 : v > 1 ? 1 : v;
    for (let i = 0; i < d.length; i += 4) {
      let r = d[i] / 255, g = d[i + 1] / 255, b = d[i + 2] / 255;
      for (const s of steps) {
        if (s.m) { const m = s.m; const R = m[0] * r + m[1] * g + m[2] * b, G = m[3] * r + m[4] * g + m[5] * b, B = m[6] * r + m[7] * g + m[8] * b; r = cl(R); g = cl(G); b = cl(B); }
        else if (s.k === "contrast") { r = cl((r - .5) * s.a + .5); g = cl((g - .5) * s.a + .5); b = cl((b - .5) * s.a + .5); }
        else if (s.k === "brightness") { r = cl(r * s.a); g = cl(g * s.a); b = cl(b * s.a); }
      }
      d[i] = r * 255; d[i + 1] = g * 255; d[i + 2] = b * 255;
    }
  }
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  // 필터 한 번 입힌 그림 (soft: 살짝 작게 그렸다 키워서 웹캠처럼 흐릿하게)
  function filtered(w, h, f) {
    const c = mk(w, h), x = c.getContext("2d", { willReadFrequently: true });
    if (f[2]) {
      const s = 1 / (1 + f[2] * .55), t = mk(Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)));
      t.getContext("2d").drawImage(src, 0, 0, t.width, t.height);
      x.imageSmoothingQuality = "high"; x.drawImage(t, 0, 0, w, h);
    } else x.drawImage(src, 0, 0, w, h);
    if (f[1].length) { const id = x.getImageData(0, 0, w, h); applyOps(id, f[1]); x.putImageData(id, 0, 0); }
    return c;
  }

  // ── 싸이체: 받침 없는 글자를 자모·비슷한 기호로 풀어 써요
  const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ", JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ";
  const JONG = ["", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
  const CV = { "ㄷ": ["ㄷ", "⊂"], "ㅇ": ["ㅇ", "○"], "ㅅ": ["ㅅ", "ヘ"], "ㅁ": ["ㅁ", "口"], "ㄹ": ["ㄹ", "己"], "ㄴ": ["ㄴ", "L"], "ㅌ": ["ㅌ", "E"], "ㅎ": ["ㅎ", "ㅎ"] };
  const VV = { "ㅏ": ["r", "ト"], "ㅐ": ["H", "H"], "ㅣ": ["l", "ı"], "ㅜ": ["ㅜ", "T"], "ㅡ": ["ㅡ", "一"] };
  const WHOLE = { "그": "ユ" };
  const CIRCLE = { "ㄱ": "㉠", "ㄴ": "㉡", "ㄷ": "㉢", "ㄹ": "㉣", "ㅁ": "㉤", "ㅂ": "㉥", "ㅅ": "㉦", "ㅇ": "㉧", "ㅈ": "㉨", "ㅊ": "㉩", "ㅋ": "㉪", "ㅌ": "㉫", "ㅍ": "㉬", "ㅎ": "㉭" };
  let seed = 1;
  const rnd = (i, k) => { let x = Math.imul(seed, 374761393) ^ Math.imul(i + 1, 668265263) ^ Math.imul(k + 7, 1274126177); x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
  const pick = (arr, r) => arr[Math.min(arr.length - 1, Math.floor(r * arr.length))];
  function cyText(s, level) {
    if (!level) return s;
    let out = "", i = 0;
    for (const ch of s) {
      i++;
      const c = ch.charCodeAt(0) - 0xac00;
      if (c < 0 || c > 11171) { out += ch; continue; }
      const L = CHO[Math.floor(c / 588)], V = JUNG[Math.floor((c % 588) / 28)], T = JONG[c % 28];
      const strong = level === 2;
      if (WHOLE[ch] && rnd(i, 9) < (strong ? .9 : .6)) { out += WHOLE[ch]; continue; }
      if (!T) {
        if (rnd(i, 1) > (strong ? .9 : .55) || !(VV[V] || CV[L])) { out += ch; continue; }
        const l = CV[L] ? (strong ? pick(CV[L], rnd(i, 2)) : (rnd(i, 2) < .2 ? CV[L][1] : L)) : L;
        const v = VV[V] ? (strong ? pick(VV[V], rnd(i, 3)) : VV[V][0]) : V;
        out += l + v;
      } else if (strong && CIRCLE[T] && (VV[V] || CV[L]) && rnd(i, 4) < .4) {
        out += (CV[L] ? pick(CV[L], rnd(i, 5)) : L) + (VV[V] ? pick(VV[V], rnd(i, 6)) : V) + CIRCLE[T];
      } else out += ch;
    }
    return out;
  }

  // ── 상태
  let src = null, name = "haduri", fi = 1, photo = null, photoKey = "", job = 0;
  const logo = new Image(); logo.src = "haduri-logo.png"; logo.onload = () => compose();
  const COLORS = ["#ffffff", "#1a1a1a", "#ff5fa2", "#5ec8ff", "#ffe14d", "#b48bff"];
  const BGS = ["#ffffff", "#111111", "#ffd6e7", "#d9f0ff"];
  let color = COLORS[0], bg = BGS[0];
  const FONT = { dot: "Galmuri11, Galmuri9, monospace", pen: "'Nanum Pen Script', cursive", base: "'Pretendard Variable', Pretendard, sans-serif" };
  const SYMS = ["♡", "♥", "☆", "★", "~", "…", "ㅠㅠ", "ㅋㅋ", "ღ", "♬", "✿", "⊙"];

  function swatch(box, list, cur, onPick) {
    box.innerHTML = list.map(c => `<button type="button" style="background:${c}" data-c="${c}" aria-label="${c}" aria-pressed="${c === cur}"></button>`).join("");
    box.onclick = e => { const b = e.target.closest("button"); if (!b) return; box.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); onPick(b.dataset.c); };
  }
  swatch($("#colors"), COLORS, color, c => { color = c; compose(); });
  swatch($("#bgs"), BGS, bg, c => { bg = c; compose(); });
  $("#syms").innerHTML = SYMS.map(s => `<button type="button">${s}</button>`).join("");
  $("#syms").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const t = $("#txt"), a = t.selectionStart ?? t.value.length, z = t.selectionEnd ?? a;
    t.value = t.value.slice(0, a) + b.textContent + t.value.slice(z);
    t.focus(); t.selectionStart = t.selectionEnd = a + b.textContent.length; textChanged();
  };

  function outSize() {
    const want = +$("#size").value, w0 = src.naturalWidth, h0 = src.naturalHeight;
    const s = want ? Math.min(1, want / w0) : Math.min(1, 2400 / Math.max(w0, h0));
    return [Math.max(1, Math.round(w0 * s)), Math.max(1, Math.round(h0 * s))];
  }
  // 필터 + 낮은 화질(JPEG 깍두기)은 사진이 바뀔 때만 다시 만들어요. 문구만 바꾸면 위에 다시 쓰기만 해요.
  async function render() {
    if (!src) return;
    const [w, h] = outSize(), q = +$("#q").value, key = [fi, w, h, q].join(",");
    $("#qV").textContent = q;
    if (key === photoKey && photo) { compose(); return; }
    const my = ++job;
    const c = filtered(w, h, FILTERS[fi]);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", [.03, .05, .08, .12, .17, .24, .33, .45, .62, .85][q - 1]));
    let bmp;
    try { bmp = await createImageBitmap(blob); }
    catch { bmp = new Image(); bmp.src = URL.createObjectURL(blob); await bmp.decode(); }
    if (my !== job) return;
    photo = bmp; photoKey = key;
    $("#info").textContent = `${w} × ${h}px · ${FILTERS[fi][0]}`;
    compose();
  }

  function wrap(x, text, maxW) {
    const lines = [];
    for (const para of text.split("\n")) {
      if (!para) { lines.push(""); continue; }
      let line = "";
      for (const ch of [...para]) {
        if (line && x.measureText(line + ch).width > maxW) {
          const sp = line.lastIndexOf(" ");
          if (sp > 0) { lines.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
          else { lines.push(line); line = ch === " " ? "" : ch; }
        } else line += ch;
      }
      lines.push(line);
    }
    return lines;
  }

  let fontWait = "";
  function compose() {
    if (!photo) return;
    const out = $("#out"), w = photo.width, h = photo.height;
    const text = cyText($("#txt").value.replace(/\s+$/, ""), +val("cy"));
    $("#cyOut").textContent = $("#txt").value.trim() ? text : "";
    const pos = val("pos"), place = val("place"), align = val("align");
    $("#bgRow").hidden = place !== "pad";
    const fam = FONT[$("#font").value], weight = $("#font").value === "dot" ? 400 : 700;
    $("#fsV").textContent = $("#fs").value;
    let fs = Math.max(10, Math.round(Math.min(w, h * 1.33) * +$("#fs").value / 100));
    const m = mk(1, 1).getContext("2d");
    let lines = [], CW = w, CH = h, box = null, fontStr = "", lh = 0, pad = 0, tw = 0, th = 0;
    const lay = () => {
      fontStr = `${weight} ${fs}px ${fam}`; m.font = fontStr;
      pad = Math.round(fs * .8); lh = Math.round(fs * ($("#font").value === "pen" ? 1.15 : 1.35));
      const areaW = pos === "bottom" ? w - pad * 2 : (place === "over" ? w * .46 : w * .6);
      lines = wrap(m, text, Math.max(fs * 2, areaW));
      tw = Math.max(...lines.map(l => m.measureText(l).width)); th = lines.length * lh;
    };
    if (text.trim()) {
      lay();
      // 사진 안(또는 옆 칸)에 다 들어가도록 글자를 줄여요
      const room = pos === "bottom" ? (place === "over" ? h * .9 : Infinity) : h - pad * 2;
      while (th > room && fs > 10) { fs = Math.max(10, Math.floor(fs * .9)); lay(); }
      if (pos === "bottom") {
        if (place === "pad") { CH = h + th + pad * 2; box = [pad, h + pad, w - pad, th]; }
        else box = [pad, h - pad - th, w - pad, th];
      } else {
        if (place === "pad") { const colW = Math.round(Math.max(tw, w * .3) + pad * 2); CW = w + colW; box = [w + pad, (h - th) / 2, CW - pad, th]; }
        else box = [Math.round(w * .5), (h - th) / 2, w - pad, th];
      }
      if (document.fonts && !document.fonts.check(fontStr, text) && fontWait !== fontStr) {
        fontWait = fontStr; document.fonts.load(fontStr, text).then(() => compose(), () => {});
      }
    }
    out.width = CW; out.height = CH;
    const x = out.getContext("2d");
    x.fillStyle = bg; x.fillRect(0, 0, CW, CH);
    x.drawImage(photo, 0, 0);
    if ($("#banner").checked && logo.complete && logo.naturalWidth) {
      const lw = Math.round(w * .32), lhh = Math.round(lw * logo.naturalHeight / logo.naturalWidth), mg = Math.round(w * .02);
      x.drawImage(logo, mg, mg, lw, lhh);
    }
    if (box) {
      const [x0, y0, x1] = box;
      x.font = fontStr; x.textBaseline = "middle"; x.textAlign = align;
      const tx = align === "left" ? x0 : align === "right" ? x1 : (x0 + x1) / 2;
      const dark = parseInt(color.slice(1, 3), 16) + parseInt(color.slice(3, 5), 16) + parseInt(color.slice(5, 7), 16) < 300;
      lines.forEach((l, i) => {
        const ty = y0 + lh * i + lh / 2;
        if ($("#stroke").checked) {
          x.lineJoin = "round"; x.lineWidth = Math.max(2, fs * .18); x.strokeStyle = dark ? "rgba(255,255,255,.95)" : "rgba(20,20,30,.9)";
          x.strokeText(l, tx, ty);
        }
        x.fillStyle = color; x.fillText(l, tx, ty);
      });
    }
    $("#save").disabled = false;
  }

  function thumbs() {
    const tw = 120, th = Math.max(1, Math.round(tw * src.naturalHeight / src.naturalWidth));
    const box = $("#fgrid"); box.innerHTML = "";
    FILTERS.forEach((f, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "fcard"; b.dataset.i = i; b.setAttribute("aria-pressed", i === fi);
      b.append(filtered(tw, Math.min(th, 160), f), Object.assign(document.createElement("span"), { textContent: f[0] }));
      box.append(b);
    });
  }
  $("#fgrid").onclick = e => {
    const b = e.target.closest(".fcard"); if (!b) return;
    fi = +b.dataset.i; $("#fgrid").querySelectorAll(".fcard").forEach(x => x.setAttribute("aria-pressed", x === b)); render();
  };

  async function add(files) {
    const f = files.find(f => f.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(f.name));
    if (!f) { say("사진 파일만 올릴 수 있어요.", "err"); return; }
    const img = new Image(); img.src = URL.createObjectURL(f);
    try { await img.decode(); } catch { say("이 사진은 열지 못했어요. 다른 형식으로 저장해서 올려 주세요.", "err"); return; }
    if (src) URL.revokeObjectURL(src.src);
    src = img; name = TT.baseName(f.name) || "haduri"; photo = null; photoKey = "";
    $("#drop").hidden = true; $("#work").hidden = false; say("");
    thumbs(); render();
  }

  let tId = 0;
  const textChanged = () => { clearTimeout(tId); tId = setTimeout(compose, 60); };
  TT.dropzone($("#drop"), add, { accept: "image/*", multiple: false });
  $("#other").onclick = () => $("#file").click();
  $("#txt").addEventListener("input", textChanged);
  ["#size", "#q"].forEach(s => $(s).addEventListener("input", render));
  ["#banner", "#stroke", "#font", "#fs"].forEach(s => $(s).addEventListener("input", compose));
  document.querySelectorAll("input[name=cy],input[name=pos],input[name=place],input[name=align]").forEach(el => el.addEventListener("change", compose));
  $("#shuffle").onclick = () => { seed = (seed * 48271 + 11) % 2147483647; if (val("cy") === "0") document.getElementById("cy1").checked = true; compose(); };
  $("#copyCy").onclick = async () => {
    const t = cyText($("#txt").value, +val("cy"));
    if (!t.trim()) { say("먼저 문구를 적어 주세요."); return; }
    try { await navigator.clipboard.writeText(t); say("바뀐 글을 복사했어요.", "ok"); } catch { say("복사하지 못했어요. 글을 직접 골라 복사해 주세요.", "err"); }
  };
  $("#save").onclick = () => $("#out").toBlob(b => { TT.download(b, name + "_하두리.jpg"); say("저장했어요.", "ok"); }, "image/jpeg", .92);

})();
</script>
