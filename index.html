<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뚝딱툴</title>
<meta name="description" content="이미지 변환, 크기 조절, 영상 자르기, 음원 자르기·피치 조절까지. 설치도 업로드도 없이 브라우저에서 바로 쓰는 무료 도구 모음.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/site.css">
<!-- AdSense 승인 후 여기에 자동 광고 스크립트를 넣으세요 -->
<style>
  .hero { padding-block: clamp(36px, 7vw, 72px) 28px; display: grid; gap: 18px; }
  .hero h1 {
    font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.08;
    font-size: clamp(34px, 7vw, 64px); letter-spacing: -.01em; text-wrap: balance; max-width: 15ch;
  }
  .hero h1 mark { background: var(--accent); color: var(--accent-ink); padding: 0 .12em; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .hero p { margin: 0; color: var(--muted); font-size: 17px; max-width: 52ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 0; padding: 0; list-style: none; }
  .facts li { font-size: 13px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; }

  .finder { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-block: 8px 20px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 2; }
  .finder input { max-width: 320px; flex: 1 1 200px; background: var(--surface); padding: 10px 14px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .group { padding-bottom: 28px; }
  .group h2 { font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .group h2::before { content: ""; width: 14px; height: 4px; border-radius: 2px; background: var(--c); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }

  .card {
    position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 18px 18px 16px; text-decoration: none; box-shadow: var(--shadow); min-width: 0;
    transition: transform .15s, border-color .15s;
  }
  /* 서랍 손잡이 같은 카테고리 탭 */
  .card::before { content: ""; position: absolute; left: 18px; top: -1px; width: 42px; height: 4px; border-radius: 0 0 3px 3px; background: var(--c); }
  a.card:hover { transform: translateY(-2px); border-color: var(--c); }
  .card .ico { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .card .ico svg { width: 22px; height: 22px; }
  .card h3 { margin: 0; font-size: 17px; line-height: 1.35; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .card .go { font-size: 13px; font-weight: 600; color: var(--c); display: flex; justify-content: space-between; align-items: center; }
  .card.soon { opacity: .62; box-shadow: none; background: transparent; border-style: dashed; }
  .card.soon .go { color: var(--muted); }
  .empty { color: var(--muted); padding: 30px 0 60px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><span class="brand-mark">뚝딱툴</span></a>
    <span class="spacer"></span>
    <span class="privacy-pill">파일은 내 기기 밖으로 나가지 않아요</span>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>자주 쓰는 파일 작업, <mark>여기서 뚝딱</mark></h1>
    <p>이미지 변환부터 영상·음원 자르기까지. 프로그램 설치도, 회원가입도, 서버 업로드도 없이 지금 열린 브라우저 안에서 바로 처리해요.</p>
    <ul class="facts">
      <li>무료 · 횟수 제한 없음</li>
      <li>워터마크 없음</li>
      <li>여러 파일 한 번에</li>
    </ul>
  </section>

  <div class="ad-slot" id="ad-top"></div>

  <div class="finder">
    <input type="text" id="q" placeholder="찾는 도구 (예: webp, 피치, 자르기)" aria-label="도구 검색">
    <div class="chips" id="chips" role="group" aria-label="분류"></div>
  </div>

  <div id="list"></div>
  <p class="empty" id="empty" hidden>찾는 도구가 아직 없어요. 다른 단어로 찾아보세요.</p>
</main>

<footer class="foot">
  <div class="wrap">
    <span>뚝딱툴 · 모든 처리는 사용자의 브라우저에서 이뤄집니다.</span>
    <span>© 2026 이어진</span>
  </div>
</footer>

<script src="assets/common.js"></script>
<script>
(() => {
  const tools = window.TT_TOOLS, cats = window.TT_CATS;
  const list = document.getElementById("list");
  const chips = document.getElementById("chips");
  const q = document.getElementById("q");
  const empty = document.getElementById("empty");
  let cat = "all";

  const used = ["all", ...Object.keys(cats).filter(k => tools.some(t => t.cat === k))];
  chips.innerHTML = used.map(k => k === "all"
    ? `<button class="chip" data-cat="all" aria-pressed="true">전체</button>`
    : `<button class="chip" data-cat="${k}" aria-pressed="false" style="--c:${cats[k].color}"><i></i>${cats[k].label}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    cat = b.dataset.cat;
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  });
  q.addEventListener("input", render);

  function card(t) {
    const c = cats[t.cat].color;
    const inner = `
      <span class="ico">${TT.icon(t.id)}</span>
      <div><h3>${t.name}</h3><p>${t.desc}</p></div>
      <span class="go">${t.status === "live" ? "열기 <span aria-hidden='true'>→</span>" : "준비 중"}</span>`;
    return t.status === "live"
      ? `<a class="card" href="tools/${t.id}/" style="--c:${c}">${inner}</a>`
      : `<div class="card soon" style="--c:${c}" aria-disabled="true">${inner}</div>`;
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const match = t => (cat === "all" || t.cat === cat) &&
      (!term || [t.name, t.desc, ...t.tags].join(" ").toLowerCase().includes(term));
    const shown = tools.filter(match);
    const order = Object.keys(cats);
    list.innerHTML = order.map(k => {
      const items = shown.filter(t => t.cat === k).sort((a, b) => (a.status === "live" ? 0 : 1) - (b.status === "live" ? 0 : 1));
      if (!items.length) return "";
      return `<section class="group" style="--c:${cats[k].color}"><h2>${cats[k].label}</h2><div class="grid">${items.map(card).join("")}</div></section>`;
    }).join("");
    empty.hidden = shown.length > 0;
  }
  render();
})();
</script>
</body>
</html>
