<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도구모음 DGMU · 설치 없이 바로 쓰는 무료 도구</title>
<meta name="description" content="PDF, 이미지, 영상, 오디오, 서류 양식까지. 설치도 가입도 업로드도 없이 브라우저에서 바로 쓰는 무료 도구 모음.">
<script>(function(){var t;try{t=localStorage.getItem("dg-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#f0f0f0">
<meta property="og:site_name" content="도구모음">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dgmoum.com/assets/og-image.png">
<meta property="og:title" content="도구모음 · 설치 없이 바로 쓰는 무료 도구 모음">
<meta property="og:description" content="이미지 변환, 크기 조절, 영상 자르기, 음원 자르기·피치 조절까지. 설치도 업로드도 없이 브라우저에서 바로 쓰는 무료 도구 모음.">
<!-- 광고: 검증한 직접 광고만 .ad-slot 자리에 넣어요 (외부 광고 스크립트 없음) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="./assets/v2.css">
</head>
<body>
<header id="hdr"></header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 id="heroH"></h1>
      <p class="sub" data-i18n="heroSub"></p>
      <p class="note" data-i18n="heroNote"></p>
      <div class="sbox" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="heroIn" data-i18n-ph="searchPh" autocomplete="off">
        <div class="sres" id="heroRes" hidden></div>
      </div>
    </div>
  </section>

  <section class="vsec" style="padding-top:8px">
    <div class="wrap">
      <div class="sh"><div><h2 data-i18n="cats"></h2><p data-i18n="catsSub"></p></div></div>
      <div class="cats" id="cats"></div>
      <div class="ad-slot" id="ad-home"></div>
    </div>
  </section>

  <section class="vsec" style="padding-top:12px">
    <div class="wrap">
      <div id="favSec" hidden style="margin-bottom:36px"><div class="sh"><div><h2 data-i18n="myFavs"></h2><p data-i18n="myFavsSub"></p></div></div><div class="vgrid" id="favGrid"></div></div>
      <div class="sh" id="allTools"><div><h2 data-i18n="popular"></h2><p data-i18n="popularSub"></p></div></div>
      <div class="vtabs" id="tabs" role="tablist"></div>
      <div id="list"></div>
    </div>
  </section>

  <section class="vsec">
    <div class="wrap">
      <div class="sh"><div><h2 data-i18n="freeTitle"></h2><p data-i18n="freeSub"></p></div></div>
      <div class="feat" id="feat"></div>
    </div>
  </section>

</main>

<footer id="foot"></footer>

<script src="./assets/common.js"></script>
<script src="./assets/i18n.js"></script>
<script src="./assets/shell.js" data-root="./"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  // 분류마다 대표 도구
  const FEAT_OF = { pro: "video-edit", fun: "pixel-art", img: "photo-edit", doc: "pdf-merge", vid: "screen-recorder", aud: "audio-edit", des: "color-palette", txt: "qr-code", form: "form-quote" };
  const FREE = ["photo-edit", "video-edit", "form-quote", "pixel-art", "text-diff", "stamp-clean"];
  let cat = "all", rot = 0, rotT = 0;

  DG.searchBox($("#heroIn"), $("#heroRes"));

  // 첫 문장: "을/를 간단하게"와 둘째 줄은 제자리, 바뀌는 낱말만 왼쪽으로 늘어나요
  function hero() {
    const w = DG.t("heroWords"), [a, p] = w[rot % w.length];
    $("#heroH").innerHTML = `<span class="ln"><span class="rot"><b>${esc(a)}</b></span><span class="pt">${esc(p)}</span>${esc(DG.t("heroL1")).replace(/^ /, "&nbsp;")}</span><span class="ln">${esc(DG.t("heroL2"))}</span>`;
  }
  clearInterval(rotT);
  // 낱말만 움직이고, 을/를은 제자리에서 조용히 바뀌어요
  rotT = setInterval(() => {
    rot++; const w = DG.t("heroWords"), [a, p] = w[rot % w.length];
    const r = document.querySelector("#heroH .rot"), pt = document.querySelector("#heroH .pt"); if (!r) return;
    const n = document.createElement("span"); n.className = "rot go"; n.innerHTML = `<b>${esc(a)}</b>`;
    r.replaceWith(n); pt.textContent = p;
  }, 2600);

  function render() {
    hero();
    const tools = DG.tools(), n = tools.length;
    $("#cats").innerHTML = DG.ORDER.map(c => {
      const f = tools.find(t => t.id === FEAT_OF[c]);
      if (c === "pro") return `<a class="cat wide" id="catcard-${c}" href="#allTools" data-c="${c}" style="--c:${DG.color(c)}">
        <span class="ic lg">${DG.CAT_ICON[c]}</span>
        <div><h3>${esc(DG.cat(c))} <small>${DG.count(c)}${esc(DG.t("tools"))}</small></h3>
        <p>${esc(DG.catTag(c))} · ${tools.filter(t => t.pro).map(t => esc(DG.name(t))).join(", ")}</p></div>
        <span class="ft">${esc(DG.t("allOf"))} ${DG.ICON.arrow}</span></a>`;
      return `<a class="cat" id="catcard-${c}" href="#allTools" data-c="${c}" style="--c:${DG.color(c)}">
        <span class="ic lg">${DG.CAT_ICON[c]}</span>
        <h3>${esc(DG.cat(c))} <small>${DG.count(c)}${esc(DG.t("tools"))}</small></h3>
        <p>${esc(DG.catTag(c))}</p>
        <span class="ft">${esc(DG.t("featured"))} · ${esc(f ? DG.name(f) : "")} ${DG.ICON.arrow}</span></a>`;
    }).join("");
    $("#tabs").innerHTML = [["all", DG.t("all")], ...DG.ORDER.map(c => [c, DG.cat(c)])]
      .map(([k, l]) => `<button class="vtab" role="tab" data-c="${k}" aria-pressed="${k === cat}" style="--c:${k === "all" ? "var(--ink)" : DG.color(k)}">${k === "all" ? "" : "<i></i>"}${esc(l)}</button>`).join("");
    list();
    $("#feat").innerHTML = FREE.map(id => tools.find(t => t.id === id)).filter(Boolean).map(t =>
      `<a class="fc" href="${DG.href(t.id)}" style="--c:${DG.color(t.cat)}"><div class="art">${DG.icon(t.id)}</div>
        <div class="body"><h3>${esc(DG.name(t))}</h3><p>${esc(DG.desc(t))}</p><span class="go">${esc(DG.t("more"))} →</span></div></a>`).join("");
    }
  // 즐겨찾는 도구 (있을 때만)
  function favList() {
    const f = DG.favs().map(id => DG.tools().find(t => t.id === id)).filter(Boolean), box = $("#favSec");
    box.hidden = !f.length; if (!f.length) return;
    $("#favGrid").innerHTML = f.map(card).join(""); DG.paintStars($("#favGrid"));
  }
  document.addEventListener("dg-fav", () => favList());
  const card = t => `<div class="vtw"><a class="vtool" href="${DG.href(t.id)}" style="--c:${DG.color(t.cat)}"><span class="ic">${DG.icon(t.id)}</span><div><b>${esc(DG.name(t))}</b><span>${esc(DG.desc(t))}</span></div></a>${DG.star(t.id)}</div>`;
  function list() {
    const tools = DG.tools();
    const cats = cat === "all" ? DG.ORDER : [cat];
    $("#list").innerHTML = cats.map(c => `<div class="ghead" style="--c:${DG.color(c)}"><span class="ic sm">${DG.CAT_ICON[c]}</span>${esc(DG.cat(c))}<small style="color:var(--muted);font-weight:600">${DG.count(c)}</small></div>
      <div class="vgrid">${tools.filter(t => DG.inCat(t, c)).map(card).join("")}</div>`).join("");
    DG.paintStars($("#list")); favList();
  }
  $("#tabs").addEventListener("click", e => { const b = e.target.closest(".vtab"); if (!b) return; cat = b.dataset.c; $("#tabs").querySelectorAll(".vtab").forEach(x => x.setAttribute("aria-pressed", x === b)); list(); });
  // '모든 도구' 제목이 헤더 바로 아래에 오도록 스크롤 (헤더 높이만큼 띄워요)
  const toAll = (smooth = true) => {
    const hdr = document.querySelector(".hdr"), off = (hdr ? hdr.offsetHeight : 64) + 16;
    const y = $("#allTools").getBoundingClientRect().top + scrollY - off;
    scrollTo({ top: y, behavior: smooth ? "smooth" : "auto" });
  };
  $("#cats").addEventListener("click", e => {
    const a = e.target.closest(".cat"); if (!a) return;
    e.preventDefault(); cat = a.dataset.c; render();
    history.replaceState(null, "", "#cat-" + cat);
    toAll();
  });
  DG.onLang(render);
  // 메뉴의 "모두 보기"(#cat-…)로 들어오면 그 분류만 보여줘요
  const h = location.hash.match(/^#cat-(\w+)/); if (h && DG.ORDER.includes(h[1])) { cat = h[1]; render(); requestAnimationFrame(() => toAll(false)); }
  addEventListener("hashchange", () => { const m = location.hash.match(/^#cat-(\w+)/); if (m && DG.ORDER.includes(m[1])) { cat = m[1]; render(); toAll(); } });
})();
</script>
</body>
</html>
