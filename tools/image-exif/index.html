<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var t;try{t=localStorage.getItem("dg-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../site.webmanifest">
<meta name="theme-color" content="#f0f0f0">
<meta property="og:site_name" content="도구모음">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dgmoum.com/assets/og-image.png">
<meta property="og:title" content="사진 정보 지우기 · 도구모음">
<meta property="og:description" content="사진 EXIF 메타데이터 확인·삭제. GPS 촬영 위치, 기기, 날짜를 화질 손실 없이 제거. 중고거래·SNS 업로드 전 개인정보 보호. 업로드 없이 브라우저에서.">
<title>사진 정보 지우기 · 도구모음</title>
<meta name="description" content="사진 EXIF 메타데이터 확인·삭제. GPS 촬영 위치, 기기, 날짜를 화질 손실 없이 제거. 중고거래·SNS 업로드 전 개인정보 보호. 업로드 없이 브라우저에서.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="../../assets/v2.css">
<style>
  body { --cat: var(--img); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; }
  .card .thumb { width: 72px; height: 72px; border-radius: 6px; object-fit: cover; background: var(--surface-2); }
  .card .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; margin: 6px 0 0; font-size: 13px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; overflow-wrap: anywhere; }
  .card dd.danger { color: var(--err); font-weight: 600; }
  .pill { display: inline-block; font-size: 12px; border-radius: 999px; padding: 2px 9px; margin-top: 6px; }
  .pill.warn { background: color-mix(in srgb, var(--err) 14%, transparent); color: var(--err); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .pill.none { background: var(--surface-2); color: var(--muted); }
  .cards { display: grid; gap: 10px; }
  .card .row { margin-top: 8px; gap: 6px; }
</style>
</head>
<body data-tool="image-exif">
<header id="hdr"></header>

<main class="wrap">
  <div class="tool-head">
    <span class="tool-tag" data-icon="image-exif"></span>
    <div>
      <h1>사진 정보 지우기</h1>
      <p>사진에 숨어 있는 촬영 위치, 기기, 찍은 시각을 보여주고 지워요. 사진은 어디에도 올라가지 않으니 안심하고 넣으세요.</p>
    </div>
  </div>

  <div class="workspace">
    <section style="display:grid; gap:14px; min-width:0">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="파일 선택">
        <span data-icon="upload"></span>
        <strong>사진을 끌어다 놓거나 눌러서 고르세요</strong>
        <span>여러 장 가능 · JPG, PNG, WEBP</span>
        <input type="file" id="file">
      </div>
      <div id="listWrap" hidden>
        <div class="list-head"><p id="summary"></p><button class="btn btn-sm" id="clear">모두 비우기</button></div>
        <div class="cards" id="cards"></div>
      </div>
      <div class="ad-slot" id="ad-main"></div>
    </section>

    <aside class="panel side">
      <div class="panel-body">
        <h2>정보 지우기</h2>
        <p class="hint">휴대폰 사진에는 찍은 장소의 GPS 좌표, 기기 모델, 찍은 시각이 숨어 있어요. 중고거래·SNS에 올리기 전에 지우면 집 위치가 드러나는 걸 막을 수 있어요.</p>
        <button class="btn btn-primary btn-block" id="run" disabled>모두 지우고 저장</button>
        <p class="status" id="status"></p>
        <p class="hint">JPG와 PNG는 다시 압축하지 않고 정보 부분만 떼어내서 <b>화질이 그대로</b>예요. 사진이 돌아가 보이지 않도록 회전 정보 하나만 남겨요.</p>
      </div>
    </aside>
  </div>
</main>

<footer id="foot"></footer>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../../assets/common.js"></script>
<script src="../../assets/i18n.js"></script>
<script src="../../assets/shell.js" data-root="../../"></script>
<script>
(() => {

  const $ = s => document.querySelector(s);
  const cards = $("#cards"), runBtn = $("#run"), say = TT.sayTo($("#status"));
  const items = [];

  TT.dropzone($("#drop"), add, { accept: "image/jpeg,image/png,image/webp,image/heic,.heic" });

  async function readInfo(blob) {
    if (!window.exifr) return null;
    try {
      const d = await exifr.parse(blob, { tiff: true, exif: true, gps: true, xmp: true, iptc: true, icc: false, mergeOutput: true, translateValues: false });
      const out = d || {};
      // PNG 기본 정보(가로·세로·색 깊이 등)는 숨은 정보가 아니라서 빼요
      ["ImageWidth", "ImageHeight", "BitDepth", "ColorType", "Compression", "Filter", "Interlace"].forEach(k => delete out[k]);
      return out;
    } catch { return {}; }
  }
  const fmtDate = d => d instanceof Date ? d.toLocaleString("ko-KR") : String(d);

  async function add(files) {
    for (const file of files) {
      const it = { file, url: URL.createObjectURL(file), bytes: new Uint8Array(await file.arrayBuffer()) };
      it.info = await readInfo(file);
      items.push(it); cards.appendChild(card(it));
    }
    refresh();
  }

  function rows(info) {
    if (!info) return [["읽기", "정보를 읽는 기능을 불러오지 못했어요"]];
    const r = [];
    if (info.latitude != null && info.longitude != null) r.push(["촬영 위치", `${info.latitude.toFixed(5)}, ${info.longitude.toFixed(5)}`, "gps"]);
    const when = info.DateTimeOriginal || info.CreateDate || info.ModifyDate; if (when) r.push(["찍은 시각", fmtDate(when)]);
    const dev = [info.Make, info.Model].filter(Boolean).join(" "); if (dev) r.push(["기기", dev]);
    if (info.LensModel) r.push(["렌즈", info.LensModel]);
    if (info.Software) r.push(["프로그램", info.Software]);
    if (info.Artist || info.Copyright) r.push(["작성자", [info.Artist, info.Copyright].filter(Boolean).join(" · ")]);
    const rest = Object.keys(info).length - r.length;
    if (rest > 0) r.push(["기타", `${rest}개 항목`]);
    return r;
  }

  function card(it) {
    const el = document.createElement("div"); el.className = "card";
    el.innerHTML = `<img class="thumb" alt="" src="${it.url}"><div style="min-width:0"><div class="name"></div><dl></dl><div class="badge"></div><div class="row"></div></div>`;
    el.querySelector(".name").textContent = it.file.name;
    it.el = el; paintCard(it); return el;
  }
  function paintCard(it) {
    const r = rows(it.done ? it.after : it.info);
    const dl = it.el.querySelector("dl"); dl.innerHTML = "";
    for (const [k, v, flag] of r) {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v; if (flag === "gps") dd.className = "danger";
      if (flag === "gps") { const a = document.createElement("a"); a.href = `https://www.google.com/maps?q=${it.info.latitude},${it.info.longitude}`; a.target = "_blank"; a.rel = "noopener"; a.textContent = " 지도에서 보기"; dd.appendChild(a); }
      dl.append(dt, dd);
    }
    const info = it.done ? it.after : it.info, n = info ? Object.keys(info).filter(k => k !== "Orientation").length : 0;
    const gps = info && info.latitude != null;
    it.el.querySelector(".badge").innerHTML = it.done
      ? `<span class="pill ${n ? "warn" : "ok"}">${n ? `아직 ${n}개 남음` : "숨은 정보 없음 · 깨끗해요"}</span>${it.note ? ` <span class="pill none">${it.note}</span>` : ""}`
      : gps ? `<span class="pill warn">촬영 위치가 들어 있어요</span>` : n ? `<span class="pill none">숨은 정보 ${n}개</span>` : `<span class="pill ok">숨은 정보 없음</span>`;
    const row = it.el.querySelector(".row"); row.innerHTML = "";
    if (it.out) { const b = document.createElement("button"); b.className = "btn btn-sm"; b.innerHTML = TT.icon("download") + " 받기"; b.onclick = () => TT.download(it.out, it.outName); row.appendChild(b); }
    const rm = document.createElement("button"); rm.className = "btn btn-sm"; rm.textContent = "빼기";
    rm.onclick = () => { URL.revokeObjectURL(it.url); items.splice(items.indexOf(it), 1); it.el.remove(); refresh(); };
    row.appendChild(rm);
  }
  function refresh() {
    $("#listWrap").hidden = !items.length; runBtn.disabled = !items.length;
    const gps = items.filter(i => !i.done && i.info?.latitude != null).length;
    $("#summary").textContent = `${items.length}장${gps ? ` · ${gps}장에 촬영 위치가 있어요` : ""}`;
  }
  $("#clear").onclick = () => { items.forEach(i => URL.revokeObjectURL(i.url)); items.length = 0; cards.innerHTML = ""; refresh(); say(""); };

  // JPG: 정보가 담긴 구간(APP1·APP13·주석)만 빼고 그대로 이어 붙여요
  function cleanJpeg(b, orient) {
    if (b[0] !== 0xFF || b[1] !== 0xD8) throw new Error("not jpeg");
    const parts = [b.subarray(0, 2)];
    if (orient && orient !== 1) parts.push(orientApp1(orient));
    let i = 2;
    while (i < b.length) {
      if (b[i] !== 0xFF) throw new Error("bad marker");
      const m = b[i + 1];
      if (m === 0xDA) { parts.push(b.subarray(i)); break; } // 그림 데이터 시작부터는 통째로
      if (m === 0xD8 || (m >= 0xD0 && m <= 0xD7) || m === 0x01) { parts.push(b.subarray(i, i + 2)); i += 2; continue; }
      const len = (b[i + 2] << 8) | b[i + 3];
      const seg = b.subarray(i, i + 2 + len);
      const drop = m === 0xE1 || m === 0xED || m === 0xFE || (m >= 0xE3 && m <= 0xEC && m !== 0xEE);
      if (!drop) parts.push(seg);
      i += 2 + len;
    }
    return new Blob(parts, { type: "image/jpeg" });
  }
  // 회전 정보 하나만 담은 아주 작은 EXIF
  function orientApp1(o) {
    const t = [0x4D, 0x4D, 0x00, 0x2A, 0, 0, 0, 8, 0, 1, 0x01, 0x12, 0, 3, 0, 0, 0, 1, 0, o, 0, 0, 0, 0, 0, 0];
    const body = [0x45, 0x78, 0x69, 0x66, 0, 0, ...t];
    const len = body.length + 2;
    return new Uint8Array([0xFF, 0xE1, len >> 8, len & 255, ...body]);
  }
  // PNG: 글자·EXIF·시간 덩어리만 빼요
  function cleanPng(b) {
    const sig = b.subarray(0, 8), parts = [sig];
    let i = 8;
    while (i < b.length) {
      const len = ((b[i] << 24) | (b[i + 1] << 16) | (b[i + 2] << 8) | b[i + 3]) >>> 0;
      const type = String.fromCharCode(b[i + 4], b[i + 5], b[i + 6], b[i + 7]);
      const total = 12 + len;
      if (!["eXIf", "tEXt", "zTXt", "iTXt", "tIME"].includes(type)) parts.push(b.subarray(i, i + total));
      i += total; if (type === "IEND") break;
    }
    return new Blob(parts, { type: "image/png" });
  }

  runBtn.onclick = async () => {
    runBtn.disabled = true; let n = 0;
    for (const it of items) {
      say(`지우는 중… ${++n}/${items.length}`);
      try {
        const t = it.file.type || "";
        if (t === "image/jpeg" || /\.jpe?g$/i.test(it.file.name)) { it.out = cleanJpeg(it.bytes, it.info?.Orientation); it.note = "화질 그대로"; }
        else if (t === "image/png") { it.out = cleanPng(it.bytes); it.note = "화질 그대로"; }
        else {
          // 그 밖의 형식은 다시 저장해서 정보를 없애요
          const c = await TT.toCanvas(it.file); it.out = await TT.canvasBlob(c, "image/jpeg", 0.95); it.note = "JPG로 다시 저장";
        }
        const ext = it.out.type === "image/png" ? "png" : "jpg";
        it.outName = `${TT.baseName(it.file.name)}_정보삭제.${ext}`;
        it.after = await readInfo(it.out); it.done = true;
      } catch (e) { console.error(e); it.note = "처리 실패"; it.done = true; it.after = it.info; }
      paintCard(it);
    }
    const ok = items.filter(i => i.out);
    if (ok.length === 1) TT.download(ok[0].out, ok[0].outName);
    else if (ok.length) await TT.downloadZip(ok.map(i => ({ blob: i.out, name: i.outName })), "정보삭제.zip");
    say(`${ok.length}장 정리했어요. 지운 뒤에 다시 검사한 결과가 각 사진에 표시돼요.`, "ok");
    refresh(); runBtn.disabled = false;
  };

})();
</script>
</body>
</html>
