<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var t;try{t=localStorage.getItem("dg-theme")}catch(e){}if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t})()</script>
<link rel="icon" href="../../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../../assets/apple-touch-icon.png">
<link rel="manifest" href="../../site.webmanifest">
<meta name="theme-color" content="#f0f0f0">
<meta property="og:site_name" content="도구모음">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dgmoum.com/assets/og-image.png">
<meta property="og:title" content="모자이크 · 가리기 · 도구모음">
<meta property="og:description" content="사진·캡처 이미지의 이름, 전화번호, 계좌번호, 얼굴을 드래그로 모자이크·흐리게·박스로 가리기. 업로드 없이 브라우저에서.">
<title>모자이크 · 가리기 · 도구모음</title>
<meta name="description" content="사진·캡처 이미지의 이름, 전화번호, 계좌번호, 얼굴을 드래그로 모자이크·흐리게·박스로 가리기. 업로드 없이 브라우저에서.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="../../assets/v2.css">
<style>
  body { --cat: var(--img); }
  .canvas-wrap { padding: 12px; display: grid; gap: 10px; }
  .board { position: relative; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--line) 0 50%) 0 0 / 16px 16px; border-radius: 8px; overflow: hidden; touch-action: none; cursor: crosshair; display: grid; place-items: center; }
  .board canvas { display: block; max-width: 100%; max-height: 70vh; width: auto; height: auto; }
  .board #ov { position: absolute; pointer-events: none; }
  .tbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .tbar p { margin: 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body data-tool="image-mosaic">
<header id="hdr"></header>

<main class="wrap">
  <div class="tool-head">
    <span class="tool-tag" data-icon="image-mosaic"></span>
    <div>
      <h1>모자이크 · 가리기</h1>
      <p>가릴 부분을 드래그하면 바로 처리돼요. 이름, 전화번호, 계좌번호, 얼굴, 차량 번호판을 올리기 전에 가리세요. 원본 사진은 이 기기 밖으로 나가지 않아요.</p>
    </div>
  </div>

  <div class="workspace">
    <section style="display:grid; gap:14px; min-width:0">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="이미지 파일 선택">
        <span data-icon="upload"></span>
        <strong>이미지를 끌어다 놓거나 눌러서 고르세요</strong>
        <span>캡처 화면은 Ctrl+V로 바로 붙여넣을 수 있어요</span>
        <input type="file" id="file">
      </div>
      <div class="panel" id="editor" hidden>
        <div class="canvas-wrap">
          <div class="tbar">
            <p id="info"></p>
            <div class="row">
              <button class="btn btn-sm" id="undo" data-icon="undo" disabled> 되돌리기</button>
              <button class="btn btn-sm" id="reset">처음으로</button>
            </div>
          </div>
          <div class="board" id="board"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
          <div class="drop compact" id="drop2" tabindex="0" role="button" aria-label="다른 이미지 고르기">
            <span data-icon="upload"></span><span>다른 이미지 고르기</span><input type="file">
          </div>
        </div>
      </div>
      <div class="ad-slot" id="ad-main"></div>
    </section>

    <aside class="panel side">
      <div class="panel-body">
        <h2>가리는 방법</h2>
        <div class="seg" role="radiogroup">
          <input type="radio" name="kind" id="k-mosaic" value="mosaic" checked><label for="k-mosaic">모자이크</label>
          <input type="radio" name="kind" id="k-blur" value="blur"><label for="k-blur">흐리게</label>
          <input type="radio" name="kind" id="k-box" value="box"><label for="k-box">박스</label>
        </div>
        <div class="field" id="strField">
          <label for="str">강도 <span class="num" id="sv">3</span></label>
          <input type="range" id="str" min="1" max="5" value="3">
          <p class="hint">글자는 강도를 높여야 알아보기 어려워요.</p>
        </div>
        <div class="field" id="colorField" hidden>
          <span class="label">박스 색</span>
          <div class="seg" role="radiogroup">
            <input type="radio" name="color" id="c-k" value="#000000" checked><label for="c-k">검정</label>
            <input type="radio" name="color" id="c-w" value="#ffffff"><label for="c-w">흰색</label>
          </div>
        </div>
        <button class="btn btn-primary btn-block" id="save" disabled data-icon="download"> 이미지 저장</button>
        <p class="status" id="status"></p>
        <p class="hint">흐리게 처리한 글자는 강도가 약하면 복원될 수 있어요. 중요한 정보는 박스로 가리는 게 가장 안전해요.</p>
      </div>
    </aside>
  </div>
</main>

<footer id="foot"></footer>

<script src="../../assets/common.js"></script>
<script src="../../assets/i18n.js"></script>
<script src="../../assets/shell.js" data-root="../../"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const cv = $("#cv"), ov = $("#ov"), board = $("#board"), ctx = cv.getContext("2d"), octx = ov.getContext("2d");
  const say = TT.sayTo($("#status"));
  let file = null, orig = null, history = [];
  const kind = () => document.querySelector("input[name=kind]:checked").value;

  document.querySelectorAll("input[name=kind]").forEach(r => r.onchange = () => {
    $("#strField").hidden = kind() === "box"; $("#colorField").hidden = kind() !== "box";
  });
  $("#str").oninput = e => $("#sv").textContent = e.target.value;

  TT.dropzone($("#drop"), f => load(f[0]), { accept: "image/*", multiple: false });
  TT.dropzone($("#drop2"), f => load(f[0]), { accept: "image/*", multiple: false, paste: false });

  async function load(f) {
    if (!f) return;
    try { orig = await TT.toCanvas(f); } catch { say("이 브라우저가 열 수 없는 이미지예요.", "err"); return; }
    file = f; history = [];
    cv.width = ov.width = orig.width; cv.height = ov.height = orig.height;
    ctx.drawImage(orig, 0, 0);
    $("#drop").hidden = true; $("#editor").hidden = false; $("#save").disabled = false;
    $("#info").textContent = `${f.name} · ${orig.width}×${orig.height}`;
    fitOverlay(); sync(); say("가릴 곳을 드래그하세요.");
  }
  function fitOverlay() {
    const r = cv.getBoundingClientRect(), b = board.getBoundingClientRect();
    Object.assign(ov.style, { left: (r.left - b.left) + "px", top: (r.top - b.top) + "px", width: r.width + "px", height: r.height + "px" });
  }
  new ResizeObserver(() => file && fitOverlay()).observe(board);

  const toPx = e => {
    const r = cv.getBoundingClientRect();
    return [Math.max(0, Math.min(cv.width, (e.clientX - r.left) / r.width * cv.width)), Math.max(0, Math.min(cv.height, (e.clientY - r.top) / r.height * cv.height))];
  };
  let drag = null;
  board.addEventListener("pointerdown", e => {
    if (!file) return;
    board.setPointerCapture(e.pointerId); fitOverlay();
    drag = { a: toPx(e), b: toPx(e) };
  });
  board.addEventListener("pointermove", e => {
    if (!drag) return;
    drag.b = toPx(e);
    const [x, y, w, h] = rect(drag);
    octx.clearRect(0, 0, ov.width, ov.height);
    const lw = Math.max(2, cv.width / 400);
    octx.setLineDash([lw * 4, lw * 3]); octx.lineWidth = lw; octx.strokeStyle = "#ffcc00";
    octx.fillStyle = "rgba(255,204,0,.15)"; octx.fillRect(x, y, w, h); octx.strokeRect(x, y, w, h);
  });
  board.addEventListener("pointerup", () => {
    if (!drag) return;
    const [x, y, w, h] = rect(drag); drag = null;
    octx.clearRect(0, 0, ov.width, ov.height);
    if (w < 3 || h < 3) return;
    history.push(ctx.getImageData(0, 0, cv.width, cv.height));
    if (history.length > 30) history.shift();
    apply(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    sync();
  });
  const rect = d => [Math.min(d.a[0], d.b[0]), Math.min(d.a[1], d.b[1]), Math.abs(d.a[0] - d.b[0]), Math.abs(d.a[1] - d.b[1])];

  function apply(x, y, w, h) {
    const k = kind(), s = +$("#str").value;
    if (k === "box") { ctx.fillStyle = document.querySelector("input[name=color]:checked").value; ctx.fillRect(x, y, w, h); return; }
    const base = Math.max(cv.width, cv.height);
    // 강도에 따라 칸 크기(모자이크) 또는 줄이는 비율(흐리게)을 정해요
    const cell = Math.max(4, Math.round(base * [0, 0.008, 0.013, 0.02, 0.03, 0.045][s]));
    const sw = Math.max(1, Math.round(w / cell)), sh = Math.max(1, Math.round(h / cell));
    const t = document.createElement("canvas"); t.width = sw; t.height = sh;
    const tg = t.getContext("2d"); tg.imageSmoothingQuality = "high";
    tg.drawImage(cv, x, y, w, h, 0, 0, sw, sh);
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (k === "mosaic") {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(t, 0, 0, sw, sh, x, y, w, h);
    } else {
      // 한 번 더 줄였다 키워서 부드럽게 흐리게
      const t2 = document.createElement("canvas"); t2.width = Math.max(1, sw >> 1); t2.height = Math.max(1, sh >> 1);
      t2.getContext("2d").drawImage(t, 0, 0, t2.width, t2.height);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
      ctx.drawImage(t2, 0, 0, t2.width, t2.height, x, y, w, h);
    }
    ctx.restore();
  }

  function sync() { $("#undo").disabled = !history.length; }
  $("#undo").onclick = () => { const d = history.pop(); if (d) ctx.putImageData(d, 0, 0); sync(); };
  document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "z" && history.length) { e.preventDefault(); $("#undo").click(); } });
  $("#reset").onclick = () => { if (!orig) return; history.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.drawImage(orig, 0, 0); sync(); };

  $("#save").onclick = async () => {
    const type = file.type === "image/png" || file.type === "image/webp" ? file.type : "image/jpeg";
    const blob = await TT.canvasBlob(cv, type, 0.92);
    const ext = { "image/png": "png", "image/webp": "webp", "image/jpeg": "jpg" }[blob.type] || "png";
    TT.download(blob, `${TT.baseName(file.name || "image")}_가림.${ext}`);
    say(`저장했어요 · ${TT.bytes(blob.size)}`, "ok");
  };
})();
</script>
</body>
</html>
